checklist_items:
- Each restaurant card on the search page shows a three-dot menu button in the top-right
  corner on hover, and clicking it opens a dropdown with 'Save to Collection', 'Copy
  Link', and 'Report Issue' options without navigating to the restaurant detail page.
- Clicking 'Save to Collection' when logged out opens the login dialog; when logged
  in, it opens the collection picker dialog, and after saving, the menu item changes
  to 'Saved ✓' with a bookmark icon overlay appearing on the card's image — clicking
  'Saved ✓' removes the restaurant from all collections, hides the bookmark, and reverts
  the label back.
- The bookmark overlay on saved restaurant cards persists across page navigation (e.g.,
  visiting a restaurant detail page and returning to search) because it is derived
  from the user's actual collection data rather than temporary UI state.
- Clicking 'Copy Link' copies the restaurant's full URL to the clipboard, shows a
  'Link copied!' toast, and records the action in localStorage under a user-specific
  key as a JSON array of objects sorted newest-first, capped at 10 entries, with no
  duplicate restaurants — re-copying the same restaurant updates its timestamp and
  moves it to the top.
- Clicking 'Report Issue' shows a 'Report submitted' toast and records the restaurant
  ID in localStorage; if the same restaurant's menu is opened again, the option displays
  'Reported', is visually disabled, and clicking it has no effect — no duplicate toast
  or entry is created.
- A red numeric badge appears on the user avatar in the header showing the count of
  copied links from localStorage, updates immediately when a new link is copied without
  page reload, does not appear when the count is zero, and persists after navigating
  between pages.
- The user avatar dropdown menu includes a 'Recently Copied' section showing up to
  3 most recent copied restaurant names as clickable links to their detail pages,
  and this section is hidden when there are no copied links.
- All localStorage-based state (copied links history, reported restaurants) uses the
  logged-in user's ID in the storage key, uses 'guest' for anonymous users, and logging
  in as a different user shows that user's own data rather than carrying over guest
  or previous-user data.
- The dropdown menu closes when clicking any action item or clicking outside the menu,
  and all features — save toggle, copy with history, report with duplicate prevention,
  and header badge — work together end-to-end across page navigations and browser
  refreshes.
