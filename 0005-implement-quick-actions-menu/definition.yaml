problem_id: 0005-implement-quick-actions-menu
app: deld
task:
  prompt: "Implement a Quick Actions menu with persistent action tracking for restaurant\
    \ cards on the search page.\n\n## Feature Requirements\n\n### 1. Menu Button &\
    \ Dropdown\nAdd a three-dot button (⋮) to the top-right corner of each restaurant\
    \ card. The button must use `data-testid=\"quick-actions-trigger-{restaurantId}\"\
    ` and must not trigger navigation to the restaurant detail page when clicked.\
    \ Clicking the button opens a dropdown menu (`data-testid=\"quick-actions-menu-{restaurantId}\"\
    `) positioned below the button. The menu contains three options, each with `role=\"\
    menuitem\"`:\n- \"Save to Collection\" (`data-testid=\"quick-action-save-{restaurantId}\"\
    `)\n- \"Copy Link\" (`data-testid=\"quick-action-copy-{restaurantId}\"`)\n- \"\
    Report Issue\" (`data-testid=\"quick-action-report-{restaurantId}\"`)\n\nThe menu\
    \ must close when an action is selected or when clicking outside. The three-dot\
    \ button should only be visible on hover over the restaurant card.\n\n### 2. Save\
    \ to Collection (Bidirectional Toggle)\nClicking \"Save to Collection\" checks\
    \ if the user is logged in. If not logged in, open the login dialog. If logged\
    \ in, open the existing save-to-collection dialog so the user can choose which\
    \ collection to save to. Once saved, the menu item text must change to \"Saved\
    \ ✓\" and its `data-testid` must change to `quick-action-unsave-{restaurantId}`.\
    \ Clicking \"Saved ✓\" removes the restaurant from all collections it belongs\
    \ to and reverts the label back to \"Save to Collection\". Additionally, a small\
    \ bookmark icon overlay (`data-testid=\"card-bookmark-{restaurantId}\"`) must\
    \ appear on the top-left corner of the restaurant card image whenever the restaurant\
    \ is in any of the user's collections. This overlay must disappear immediately\
    \ when the restaurant is unsaved. The bookmark indicator must also be visible\
    \ when the user navigates away from the search page and returns — it should be\
    \ derived from the user's actual collection data, not ephemeral state.\n\n###\
    \ 3. Copy Link with Persistent History\nClicking \"Copy Link\" copies the restaurant's\
    \ full URL (format: `{window.location.origin}/restaurants/{restaurantId}`) to\
    \ the clipboard and shows a \"Link copied!\" toast. Each copy action is recorded\
    \ in localStorage under the key `deld:copied-links:{userId}` (use `deld:copied-links:guest`\
    \ for logged-out users). The stored value must be a JSON array of objects with\
    \ this exact structure:\n```json\n[\n  { \"restaurantId\": \"abc123\", \"restaurantName\"\
    : \"Sushi Place\", \"copiedAt\": \"2024-01-15T10:30:00.000Z\" }\n]\n```\nThe array\
    \ must be sorted by `copiedAt` descending (newest first) and capped at 10 entries.\
    \ When a new entry would exceed 10, the oldest entry is evicted. If the same restaurant\
    \ is copied again, its `copiedAt` timestamp must be updated and it must move to\
    \ the top — no duplicate restaurantId entries allowed. This data must persist\
    \ across page navigation: navigating to a restaurant detail page and back to search\
    \ must preserve the full history.\n\n### 4. Report Issue with Duplicate Prevention\n\
    Clicking \"Report Issue\" shows a \"Report submitted\" toast and records the restaurant\
    \ ID in localStorage under the key `deld:reported-restaurants:{userId}` (use `deld:reported-restaurants:guest`\
    \ for logged-out users). The stored value must be a JSON array of restaurant ID\
    \ strings:\n```json\n[\"abc123\", \"def456\"]\n```\nIf a restaurant has already\
    \ been reported (its ID exists in the array), the menu item must display \"Reported\"\
    \ instead of \"Report Issue\", must have `aria-disabled=\"true\"`, and clicking\
    \ it must have no effect — no duplicate toast, no duplicate entry. The reported\
    \ state must persist across page navigation and survive browser refresh.\n\n###\
    \ 5. Copied Links Badge in Header (Multi-Surface)\nWhen a logged-in user has entries\
    \ in their copied-links history (from Requirement 3), display a numeric badge\
    \ (`data-testid=\"copied-links-badge\"`) on the user avatar button (`[data-testid=\"\
    user-avatar-menu-trigger\"]`). The badge shows the count of items currently in\
    \ the `deld:copied-links:{userId}` localStorage array. The badge must:\n- Update\
    \ immediately when a new link is copied (no page reload required)\n- Not render\
    \ when the count is 0\n- Persist after page navigation (read from localStorage\
    \ on component mount)\n- Be styled as a small red circle with white text, positioned\
    \ at the top-right of the avatar\n\nAdditionally, add a \"Recently Copied\" section\
    \ (`data-testid=\"recently-copied-section\"`) inside the user avatar dropdown\
    \ menu, appearing between the existing menu items and the logout button. This\
    \ section shows up to 3 most recent copied restaurant names as links to their\
    \ detail pages. Each link must use `data-testid=\"recently-copied-item-{restaurantId}\"\
    `. If there are no copied links, this section must not render.\n\n## Routes\n\
    No new routes. Modifies the search page (`/`) and header components.\n\n## Authentication\n\
    - Save to Collection requires login (opens login dialog if not authenticated)\n\
    - Copy Link and Report Issue work for both logged-in and guest users\n- localStorage\
    \ keys use the user's ID for logged-in users, literal string \"guest\" for anonymous\
    \ users\n- When a guest user logs in, their guest localStorage data does NOT migrate\
    \ — the logged-in user starts fresh\n\n## State & Persistence\n- Saved/unsaved\
    \ bookmark state: Derived from user's actual collections via existing collection\
    \ query — not localStorage\n- Copy history: `deld:copied-links:{userId}` — JSON\
    \ array, max 10, sorted by copiedAt desc, no duplicate restaurantIds\n- Report\
    \ state: `deld:reported-restaurants:{userId}` — JSON array of restaurant ID strings\n\
    - Header badge count: Reactively reads from copied-links localStorage, updates\
    \ without page reload\n\n## Files\n5-7 files: restaurant card component, quick\
    \ actions menu component, localStorage utility hooks, header badge component,\
    \ user avatar menu modification"
hint: "**Preferred Account**: If login is required, please use the following credentials:\n\
