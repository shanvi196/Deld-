problem_metadata:
  task_type: feature-implementation
  description: Implement a monthly dining expense tracker for the Deld restaurant
    platform. Users need to record...
checklist_items:
- Logged-in users see a 'Log Expense' button on each restaurant detail page that opens
  a dialog where they can enter a dollar amount and date, submit it, and see a success
  toast — while guests do not see this button at all.
- The expense dialog validates the amount field, rejecting values that are zero, negative,
  or above $10,000, and showing an inline error message for invalid entries while
  preventing submission.
- The /dining-expenses page is auth-protected (redirecting unauthenticated visitors
  to the home page with a login prompt) and displays a chronological list of logged
  expenses sorted newest-first, each showing restaurant name as a link to its detail
  page, formatted dollar amount, and formatted date.
- Users can delete individual expenses via a trash icon on each entry and clear all
  expenses with a 'Clear All' button; deletions immediately update the list, monthly
  totals, and the budget warning banner, and the 'Clear All' button is disabled when
  no expenses exist.
- A monthly summaries section displays total spending per month in reverse chronological
  order, and a warning banner appears only when the current month's total exceeds
  $500, disappearing immediately when expenses are deleted back to $500 or below.
- The user avatar dropdown menu includes a 'Dining Expenses' link that navigates to
  the expenses dashboard and shows a badge with the current month's total spending
  — the badge is hidden when no expenses exist for the current month and updates in
  real-time as expenses are added or deleted.
- All expense data is stored per-user in localStorage, persists across page reloads
  and navigation, and is fully isolated between user accounts — logging in as a different
  user shows only that user's expenses.
- The expense list enforces a cap of 50 entries per user, automatically removing the
  oldest expense when a new one would exceed this limit, and an empty state message
  is displayed when no expenses have been logged.
