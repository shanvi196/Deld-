- name: vlm
  args:
    score_name: screenshot_9_rate_the_visual
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the visual display of poll buttons below a review on
      a scale of 0 to 1:


      0 - Poll not visible or broken: No Yes/No buttons visible below any review,
      poll question text missing, buttons not styled or positioned incorrectly, no
      review-poll container visible


      1 - Poll correctly displayed: Clear "Did this review help you decide?" question
      text visible below a review, Yes and No buttons displayed inline and clearly
      clickable, buttons styled consistently with app design, poll container properly
      positioned below review content'
    scale:
    - 0
    - 1
    prep_script:
    - localStorage.removeItem('review-polls')
    - await new Promise(resolve => setTimeout(resolve, 2500))
    - '(function() { const reviewSection = document.querySelector(''[data-testid="recommended-reviews-section"]'')
      || document.querySelector(''[class*="review"]''); if (reviewSection) { reviewSection.scrollIntoView({
      behavior: ''instant'', block: ''center'' }); } })()'
    - await new Promise(resolve => setTimeout(resolve, 500))
- name: vlm
  args:
    score_name: screenshot_10_rate_the_visual
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the visual display of the results bar after voting on
      a scale of 0 to 1:


      0 - Results not displayed or broken: Yes/No buttons still visible after clicking,
      no percentage text shown, no result bar visible, no vote count displayed, poll
      area unchanged after vote


      1 - Results correctly displayed: Buttons replaced with animated result bar,
      percentage text clearly visible showing "100% found helpful" or similar, result
      bar shows filled percentage with CSS transition, vote count displayed near result
      (showing "1" or "1 vote"), clear visual indication that vote was recorded'
    scale:
    - 0
    - 1
    prep_script:
    - localStorage.removeItem('review-polls')
    - await new Promise(resolve => setTimeout(resolve, 2500))
    - (function() { const yesBtn = document.querySelector('[data-testid^="poll-yes-btn-"]');
      if (yesBtn) { yesBtn.click(); } })()
    - await new Promise(resolve => setTimeout(resolve, 1000))
    - '(function() { const resultEl = document.querySelector(''[data-testid^="poll-result-"]'');
      if (resultEl) { resultEl.scrollIntoView({ behavior: ''instant'', block: ''center''
      }); } })()'
    - await new Promise(resolve => setTimeout(resolve, 500))
