problem_id: 0050-review-reaction-quick-poll
app: deld
task:
  prompt: 'Implement a Review Reaction Quick Poll for restaurant reviews. Users should
    be able to vote on whether a review helped them decide.


    **Feature Requirements**:


    1. **Poll Buttons Component**: Add Yes/No buttons below each review asking "Did
    this review help you decide?". Buttons render inline using data-testid="review-poll-{reviewId}"
    container, with data-testid="poll-yes-btn-{reviewId}" and data-testid="poll-no-btn-{reviewId}".
    Clicking stores vote in localStorage under key "review-polls" as object {[reviewId]:
    "yes"|"no"}. Buttons disable after voting.


    2. **Results Display**: After voting, replace buttons with animated result bar
    showing percentage. Display "X% found helpful" with data-testid="poll-result-{reviewId}".
    Bar fills to percentage width with CSS transition. Calculate from all votes for
    that reviewId in localStorage. Show total vote count with data-testid="poll-count-{reviewId}".


    **Routes**: Restaurant detail page /restaurants/[id] (existing)


    **Existing Infrastructure**: Reviews render in data-testid="recommended-reviews-section"
    with individual data-testid="review-card" elements


    **Element Selectors**:
    - Poll no btn: `[data-testid="poll-no-btn-${secondReviewId}"]`
    - Poll yes btn: `[data-testid="poll-yes-btn-${secondReviewId}"]`
    - Poll result: `[data-testid="poll-result-${firstReviewId}"]`
    - Poll yes btn: `[data-testid="poll-yes-btn-${reviewId}"]`'
hint: '**Files**: ~3-4 (review-poll component, review-card integration, localStorage
  utility)


  **Authentication**: Not required - anonymous voting allowed

    **Preferred Account**: If login is required, please use the following credentials:
    - Login: sarah.chen@email.com
    - Password: password123


    **localStorage** use following keys in localStorage:

    - `review-polls`'
