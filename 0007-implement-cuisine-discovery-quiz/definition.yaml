problem_id: 0007-implement-cuisine-discovery-quiz
app: deld
task:
  prompt: 'Implement a cuisine discovery quiz feature that helps users find new restaurant cuisines to try. Add a "Discover Cuisines" button to the homepage that opens a dialog with a 3-question quiz about taste preferences (spice level, dietary preference, atmosphere preference). After completion, display 3 recommended cuisine types with brief descriptions and a button to search for each cuisine.


    **Feature Requirements**:


    1. **Quiz Dialog Component**: Add a "Discover Cuisines" button below the search bar on the homepage that opens a modal dialog. The quiz has 3 single-choice questions: "How spicy do you like your food?" (Mild/Medium/Spicy/Very Spicy), "Dietary preference?" (No Preference/Vegetarian/Vegan/Pescatarian), "Preferred dining atmosphere?" (Casual/Fine Dining/Family-Friendly/Romantic). Each question is shown one at a time with Next/Back buttons for navigation. Include a progress indicator showing current step (e.g., "1 of 3"). All questions must be answered before showing results.


    2. **Results Display Component**: After completing the quiz, show a results screen within the same dialog displaying 3 recommended cuisines. Each recommendation shows the cuisine name as a heading, a 1-2 sentence description explaining why it matches their preferences, and a "Search {Cuisine}" button that closes the dialog and navigates to the search page with that cuisine filter applied. Include a "Retake Quiz" button to restart from question 1.


    **Routes**: Homepage (/) - no new routes, uses dialog overlay.


    **Files**: 4 files (quiz dialog component, quiz logic/recommendation algorithm, homepage integration, CSS/styling if needed).


    **Authentication**: Not required (available to all users).

    **Preferred Account**: If login is required, please use the following credentials: - Login: sarah.chen@email.com - Password: password123


    **Element Selectors**:
    - Search cuisine button 0: `[data-testid="search-cuisine-button-0"]`
    - Quiz answer Spicy: `[data-testid="quiz-answer-Spicy"]`
    - Quiz back button: `[data-testid="quiz-back-button"]`
    - Quiz answer Medium: `[data-testid="quiz-answer-Medium"]`
    - Cuisine card: `[data-testid="cuisine-card-"]`
    - Cuisine quiz dialog: `[data-testid="cuisine-quiz-dialog"]`
    - Discover cuisines button: `[data-testid="discover-cuisines-button"]`
    - Quiz answer Casual: `[data-testid="quiz-answer-Casual"]`
    - Quiz answer Vegan: `[data-testid="quiz-answer-Vegan"]`
    - Quiz answer Vegetarian: `[data-testid="quiz-answer-Vegetarian"]`
    - Quiz dialog close: `[data-testid="quiz-dialog-close"]`
    - Quiz next button: `[data-testid="quiz-next-button"]`
    - Retake quiz button: `[data-testid="retake-quiz-button"]`'
