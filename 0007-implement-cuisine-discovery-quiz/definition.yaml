- name: vlm
  args:
    score_name: screenshot_9_rate_the_quiz
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the quiz question screen visual display on a scale of 0 to 1:


      0 - Quiz dialog not visible or major layout issues: Dialog not displayed, heading "How spicy do you like your food?" missing or incorrect, radio button options not showing all 4 labels (Mild/Medium/Spicy/Very Spicy) in clear vertical layout, progress indicator "1 of 3" not visible at top of dialog, or quiz-next-button not visible or not displaying disabled styling with reduced opacity


      1 - Quiz question screen correctly displayed: Dialog visible with heading "How spicy do you like your food?" prominently shown, exactly 4 radio button options clearly visible with labels "Mild", "Medium", "Spicy", "Very Spicy" in vertical layout, progress indicator "1 of 3" visible at top of dialog, and quiz-next-button visible with disabled styling (reduced opacity/muted appearance)'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - (function() { const btn = document.querySelector('[data-testid="discover-cuisines-button"]'); if (btn) btn.click(); })();
    - await new Promise(resolve => setTimeout(resolve, 1500))
