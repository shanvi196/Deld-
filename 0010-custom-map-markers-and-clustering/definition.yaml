  intent: 2
checklist_items:
- A collapsible floating control panel appears in the top-right corner of the home
  page map, with a toggle button that opens and closes it, containing marker style
  options (pin and circle), five color swatches (red, blue, green, purple, orange),
  a show/hide labels toggle, and a reset button — with the active style and color
  visually highlighted (distinct background for style, checkmark or ring for color).
- Selecting 'circle' style changes all restaurant markers on the home page map to
  filled circle markers in the chosen color, selecting 'pin' style renders standard
  pin markers with a colored icon, and enabling labels displays restaurant names as
  text below each marker — all changes apply immediately on selection.
- 'Marker preferences persist across full page navigations: after customizing markers
  on the home page, navigating to a restaurant detail page and returning to the home
  page shows the same custom markers, and a full page reload also preserves the selections.'
- Each logged-in user has independent marker preferences — logging in as User A with
  green circle markers, then logging out and logging in as User B shows User B's own
  saved preferences (or defaults if none were saved), and logging back into User A
  restores green circle markers.
- 'A guest user''s marker preferences migrate to their account upon login: customizing
  markers while logged out, then logging in applies those guest preferences to the
  newly logged-in session (provided the user had no previously saved preferences),
  and the guest preferences are cleared from storage.'
- The restaurant detail page map reflects the user's marker preferences — if the user
  selected green circle markers on the home page, the single location marker on the
  detail page also renders as a green circle, and a 'Custom Map View' chip appears
  near the location section heading that navigates back to the home page when clicked.
- The reset button restores all preferences to defaults (pin style, red color, labels
  hidden) and is disabled when all settings are already at their default values; additionally,
  the control panel toggle button shows a numeric badge indicating how many settings
  differ from defaults (1 to 3), and the badge disappears when everything is reset
  to defaults.
- When all preferences are at default values, neither the badge on the map control
  toggle nor the 'Custom Map View' chip on the restaurant detail page is visible.
