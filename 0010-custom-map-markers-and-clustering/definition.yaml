problem_id: 0010-custom-map-markers-and-clustering
app: deld
task:
  prompt: "Implement map marker customization controls for the home page. Users want\
    \ to personalize how restaurant markers appear on the map, with preferences persisted\
    \ per user and applied across all maps in the app.\n\n**Feature Requirements**:\n\
    \n1. **Map Control Panel**: Add a collapsible floating control panel in the top-right\
    \ corner of the map area on the home page. A toggle button (data-testid=\"map-control-toggle\"\
    ) opens/closes the panel (data-testid=\"map-control-panel\"). The panel contains\
    \ three groups of controls:\n   - **Marker Style**: Two icon buttons — \"Pin\"\
    \ (data-testid=\"marker-style-pin\") for default pin markers and \"Circle\" (data-testid=\"\
    marker-style-circle\") for circle markers. The active style button must have a\
    \ visually distinct highlight (e.g., colored background or border). Default: \"\
    pin\".\n   - **Marker Color**: Five color swatch buttons — red (data-testid=\"\
    marker-color-red\"), blue (data-testid=\"marker-color-blue\"), green (data-testid=\"\
    marker-color-green\"), purple (data-testid=\"marker-color-purple\"), orange (data-testid=\"\
    marker-color-orange\"). The active color swatch must show a checkmark or ring\
    \ indicator. Default: \"red\".\n   - **Show Labels Toggle**: A toggle button (data-testid=\"\
    toggle-labels-button\") to show/hide restaurant names as text labels below each\
    \ marker on the map. When enabled, each marker displays the restaurant name underneath\
    \ it. Default: labels hidden.\n   - **Reset to Defaults**: A button (data-testid=\"\
    reset-preferences-button\") that restores all marker preferences to their default\
    \ values (pin style, red color, labels hidden). This button should only be enabled\
    \ when at least one setting differs from defaults; otherwise it appears disabled.\n\
    \   - **Non-Default Badge**: When any preference differs from its default value,\
    \ the map-control-toggle button must display a small numeric badge (data-testid=\"\
    preferences-badge\") showing the count of non-default settings (1–3). When all\
    \ settings are at defaults, the badge must not be rendered.\n\n2. **User-Scoped\
    \ Persistence**: Marker preferences must be saved to localStorage and survive\
    \ full page navigation (e.g., navigate to a restaurant detail page and back —\
    \ preferences must still be applied).\n   - **Logged-in users**: Store under key\
    \ `deld-map-preferences-{userId}` where `{userId}` is the authenticated user's\
    \ ID. Each user's preferences are independent.\n   - **Guest users** (not logged\
    \ in): Store under key `deld-map-preferences-guest`.\n   - **Login migration**:\
    \ When a guest user logs in, if `deld-map-preferences-guest` exists in localStorage,\
    \ migrate its contents to `deld-map-preferences-{userId}` (only if the user does\
    \ not already have saved preferences) and delete the guest key.\n   - **Logout\
    \ behavior**: When a user logs out, their preferences remain saved under their\
    \ user-scoped key for their next login. The app should fall back to the guest\
    \ key (or defaults if no guest key exists).\n   - **JSON structure**: `{ \"markerStyle\"\
    : \"pin\" | \"circle\", \"markerColor\": \"red\" | \"blue\" | \"green\" | \"purple\"\
    \ | \"orange\", \"showLabels\": boolean }`\n\n3. **Multi-Surface Marker Rendering**:\
    \ The saved marker preferences must apply to ALL Leaflet maps in the application,\
    \ not just the home page:\n   - **Home page map** (`/`): All restaurant markers\
    \ render using the selected style and color. When \"circle\" style is selected,\
    \ markers render as Leaflet `CircleMarker` components with the chosen color as\
    \ fill. When \"pin\" style is selected, markers render as standard `Marker` components\
    \ with a colored icon matching the chosen color. Labels (restaurant names) appear\
    \ below markers when enabled.\n   - **Restaurant detail page map** (`/restaurants/[id]`):\
    \ The single location marker in the LocationAndHoursSection must also reflect\
    \ the user's marker style and color preferences. If the user chose circle markers\
    \ in green, the detail page map marker must also be a green circle marker.\n\n\
    4. **Preference Indicator on Detail Page**: On restaurant detail pages (`/restaurants/[id]`),\
    \ when the user has any non-default map preferences, display a small chip/badge\
    \ (data-testid=\"map-customized-indicator\") near the LocationAndHoursSection\
    \ heading that reads \"Custom Map View\". This chip should be styled as a subtle\
    \ pill (e.g., small, rounded, muted background). Clicking this chip navigates\
    \ the user back to the home page (`/`). When all preferences are at default values,\
    \ this chip must not be rendered.\n\n**Routes**: Home page `/` (existing), Restaurant\
    \ detail page `/restaurants/[id]` (existing)\n\n**Auth**: Feature works for both\
    \ logged-in and guest users. Logged-in user preferences are isolated per user\
    \ ID. Guest preferences are shared and migrate on login.\n\n**State**: localStorage\
    \ with keys `deld-map-preferences-{userId}` or `deld-map-preferences-guest`. JSON\
    \ shape: `{ \"markerStyle\": \"pin\" | \"circle\", \"markerColor\": \"red\" |\
    \ \"blue\" | \"green\" | \"purple\" | \"orange\", \"showLabels\": boolean }`.\
    \ Defaults: `{ \"markerStyle\": \"pin\", \"markerColor\": \"red\", \"showLabels\"\
    : false }`."
