    screenshot_url: http://localhost:3000/events/event_1769116701391_tgheers
    evaluation_rubric: 'Rate the event details page display on a scale of 0 to 1:


      0 - Event page not displayed or broken: The event details page shows a 404 error, event not found message, blank page,
      or significant rendering errors. The event name, date, and restaurant link are not visible or the page layout is broken.


      1 - Event details correctly displayed: The event details page shows the event information clearly with the event name
      ''Screenshot Test Event'' prominently displayed, the event date shown in a readable format (August 15, 2025 or similar),
      and a visible link to the associated restaurant. The page has a clean layout consistent with the application''s styling.'
    scale:
    - 0
    - 1
    prep_script:
    - '(function() { const event = { id: ''evt_visual789'', restaurantId: ''25047088-5a40-4fab-be5c-3ee9a54fb980'', name:
      ''Screenshot Test Event'', date: ''2025-08-15'', createdAt: new Date().toISOString() }; const events = [event]; localStorage.setItem(''groupEvents'',
