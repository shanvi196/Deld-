problem_id: 0031-group-dining-organizer
app: deld
task:
  prompt: 'Implement a Group Dining Planner feature for organizing restaurant visits with friends. Users need to create group
    dining events and share them.


    **Feature Requirements**:


    1. **Event Creation Modal**: Add ''Plan Group Visit'' button (data-testid=''plan-group-visit-button'') on restaurant detail
    pages. Opens modal (data-testid=''group-event-modal'') with form fields: event name input (data-testid=''event-name-input''),
    date picker (data-testid=''event-date-input''), and create button (data-testid=''create-event-button''). On submit, generate
    unique event ID, save to localStorage key ''groupEvents'' as JSON array with structure {id, restaurantId, name, date,
    createdAt}, show success toast with text "Event created successfully", and display shareable link (data-testid=''event-share-link'').


    2. **Event Details Page**: Create /events/[id] route displaying event information. Page shows event name (data-testid=''event-name''),
    restaurant name with link (data-testid=''event-restaurant-link''), event date (data-testid=''event-date''), and ''Event
    not found'' message (data-testid=''event-not-found'') for invalid IDs. Load event data from localStorage.


    **Routes**: /events/[id] (new public route)


    '
hint: '**Files**: ~4 (modal component, event page, localStorage utility, restaurant detail integration)


  **Authentication**: Event creation requires login; event viewing is public


  **localStorage** use following keys in localStorage:

  - `groupEvents`'
