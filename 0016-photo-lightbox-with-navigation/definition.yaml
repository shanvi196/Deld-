problem_id: 0016-photo-lightbox-with-navigation
app: deld
task:
  prompt: 'Implement a photo lightbox modal for review photos. When users browse restaurant
    reviews, they should be able to click on any review photo to view it in a fullscreen
    lightbox overlay.


    **Feature Requirements**:


    1. **Lightbox Modal**: When clicking any photo in review cards, open a centered
    fullscreen modal overlay displaying the photo at larger size. Include a close
    button (data-testid="lightbox-close-button") and semi-transparent backdrop. The
    modal container should have data-testid="photo-lightbox-modal". The large photo
    display should have data-testid="lightbox-photo".


    2. **Keyboard Navigation**: Support keyboard controls - Escape key closes the
    modal, left/right arrow keys navigate between photos when a review has multiple
    photos. Track current photo index in React state. Display current position indicator
    (data-testid="lightbox-photo-counter") showing "X of Y" format.


    **Routes**: Restaurant detail page at /restaurants/[id] (existing)'
hint: '**Files**: ~3-4 files (photo-lightbox component, update review-photos component,
  keyboard hook)


  **Authentication**: Not required

    **Preferred Account**: If login is required, please use the following credentials:
    - Login: sarah.chen@email.com
    - Password: password123'
