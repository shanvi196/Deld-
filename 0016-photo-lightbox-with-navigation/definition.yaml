- name: vlm
  args:
    score_name: screenshot_9_rate_the_lightbox
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the lightbox modal appearance on a scale of 0 to 1:


      0 - Lightbox not visible: No modal overlay appeared after clicking review photo,
      or page shows error, or no semi-transparent backdrop visible, or no enlarged
      photo displayed


      1 - Lightbox correctly displayed: A centered modal overlay is visible with semi-transparent
      dark backdrop covering the page content, an enlarged photo is prominently displayed
      in the center of the modal, a close button (X or similar) is visible in the
      corner of the modal, and the modal appears properly styled as a fullscreen lightbox
      overlay'
    scale:
    - 0
    - 1
    prep_script:
    - window.location.href = 'http://localhost:3000'
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - (function () { var links = document.querySelectorAll('a');
      for (var i = 0; i < links.length; i++) { if (links[i].href && links[i].href.indexOf('/restaurants/') !== -1) { links[i].click();
          break; } } })();
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - '(function() { const reviewsSection = document.querySelector(''[data-testid="recommended-reviews-section"]'');
      if (reviewsSection) { reviewsSection.scrollIntoView({ behavior: ''instant'',
      block: ''start'' }); } })()'
    - await new Promise(resolve => setTimeout(resolve, 1000))
    - (function() { const reviewPhoto = document.querySelector('[data-testid="review-photo"]');
      if (reviewPhoto) { reviewPhoto.click(); } })()
    - await new Promise(resolve => setTimeout(resolve, 1500))
- name: vlm
  args:
    score_name: screenshot_10_rate_the_lightbox
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the lightbox photo counter display on a scale of 0 to
      1:


      0 - Photo counter not visible or incorrect: No photo counter visible in the
      lightbox modal, or counter does not show "X of Y" format, or counter is not
      clearly visible against the modal background


      1 - Photo counter correctly displayed: A photo counter is visible in the lightbox
      showing position in "X of Y" format (e.g., "1 of 3"), the counter is clearly
      legible against the modal background, and the modal displays the enlarged photo
      with the counter indicating which photo is currently being viewed'
    scale:
    - 0
    - 1
    prep_script:
    - window.location.href = 'http://localhost:3000'
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - (function () { var links = document.querySelectorAll('a');
      for (var i = 0; i < links.length; i++) { if (links[i].href && links[i].href.indexOf('/restaurants/') !== -1) { links[i].click();
          break; } } })();
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - '(function() { const reviewsSection = document.querySelector(''[data-testid="recommended-reviews-section"]'');
      if (reviewsSection) { reviewsSection.scrollIntoView({ behavior: ''instant'',
      block: ''start'' }); } })()'
    - await new Promise(resolve => setTimeout(resolve, 1000))
    - (function () { var reviewPhotos = document.querySelectorAll('[data-testid="review-photo"]');
      if (reviewPhotos.length > 1) { reviewPhotos[1].click(); } })();
    - await new Promise(resolve => setTimeout(resolve, 1500))
