    score_name: screenshot_10_rate_the_zoomed
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the zoomed photo state at maximum zoom on a scale of 0 to 1:


      0 - Photo not zoomed or controls missing: Photo appears at normal 1x scale, zoom level indicator missing or still shows
      ''1.0x'', or zoom controls overlay not visible at all.


      1 - Photo correctly zoomed to 3.0x: Photo dialog shows zoomed-in photo at 3.0x scale (photo appears larger/cropped due
      to zoom transform). Zoom level indicator displays ''3.0x''. Zoom in button appears disabled (reduced opacity) since
      max zoom reached. Zoom out and reset buttons appear enabled (full opacity). Container shows grab cursor style indicating
      pan capability.'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 4500))
    - (function() { const slide = document.querySelector('[data-testid="menu-carousel-slide"]'); if (slide) slide.click();
      })()
    - await new Promise(resolve => setTimeout(resolve, 1500))
    - (function() { const zoomIn = document.querySelector('[data-testid="zoom-in-button"]'); if (zoomIn) { zoomIn.click();
      } })()
    - await new Promise(resolve => setTimeout(resolve, 1000))
    - (function() { const zoomIn = document.querySelector('[data-testid="zoom-in-button"]'); if (zoomIn) { zoomIn.click();
      } })()
    - await new Promise(resolve => setTimeout(resolve, 1000))
    - (function() { const zoomIn = document.querySelector('[data-testid="zoom-in-button"]'); if (zoomIn) { zoomIn.click();
