- name: vlm
  args:
    score_name: screenshot_9_rate_the_zoom
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the zoom controls overlay at default state on a scale of 0 to 1:


      0 - Zoom controls not visible: Photo dialog may or may not be open, but zoom controls overlay is missing. No zoom in
      button, zoom out button, reset button, or zoom level indicator visible in the dialog.


      1 - Zoom controls correctly displayed: Photo dialog is open showing menu/food photo. Zoom controls overlay visible in
      bottom-right corner with three buttons: zoom in (+), zoom out (-), and reset (expand icon). Zoom level indicator shows
      ''1.0x'' in white text. Zoom out and reset buttons appear disabled or grayed out (reduced opacity). Photo displays at
      normal scale (1x).'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 2500))
    - (function() { const slide = document.querySelector('[data-testid="menu-carousel-slide"]'); if (slide) slide.click();
      })()
    - await new Promise(resolve => setTimeout(resolve, 1500))
- name: vlm
