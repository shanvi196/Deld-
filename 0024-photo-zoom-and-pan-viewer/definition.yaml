problem_id: 0024-photo-zoom-and-pan-viewer
app: deld
task:
  prompt: 'Implement photo zoom and pan controls for the restaurant photo viewer. Users want to inspect food and menu photos
    more closely by zooming in and panning around.


    **Feature Requirements**:


    1. **Zoom Controls Overlay**: Add a control overlay to the PhotoBox component in the menu photo dialog. Include three
    circular buttons: zoom in (+ icon, data-testid="zoom-in-button"), zoom out (- icon, data-testid="zoom-out-button"), and
    reset zoom (expand icon, data-testid="zoom-reset-button"). Position buttons in bottom-right corner above the photo counter.
    Zoom in increases scale by 0.5x (max 3x), zoom out decreases by 0.5x (min 1x), reset returns to 1x. Display current zoom
    level as text "1.0x" with data-testid="zoom-level-indicator". Disable zoom-out and reset buttons when at 1x scale. Disable
    zoom-in button when at 3x scale.


    2. **Pan Functionality**: When zoom level is above 1x, enable click-and-drag panning on the photo. Use CSS transform for
    both scale and translate. Track pan position with useState. Reset pan position to center (0,0) when zoom resets or when
    navigating to different photo. Show grab cursor when zoomed (cursor: grab), default cursor at 1x. Container data-testid="zoomable-photo-container".


    **Routes**: Existing `/restaurants/[id]` page, menu photo dialog'
hint: '**Files**: ~3 (photo-box.tsx modification, new zoom-controls.tsx component, optional hook)


  **Authentication**: Not required

  **Preferred Account**: If login is required, please use the following credentials: - Login: sarah.chen@email.com - Password:
  password123'
