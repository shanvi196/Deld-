problem_id: 0009-restaurant-availability-alerts
app: deld
task:
  prompt: 'Implement Restaurant Availability Alerts for the Deld app. Users want to be notified when closed restaurants are
    about to open.


    **Feature Requirements**:


    1. **Notify Me Button on Closed Restaurants**: Add a ''Notify Me'' button (data-testid=''notify-me-button'') that appears
    ONLY on restaurant cards showing closed status. The button displays a tooltip (data-testid=''notify-tooltip'') showing
    the next opening time (e.g., ''Opens at 11:00 AM''). Clicking opens a modal (data-testid=''alert-modal'') with radio options
    for reminder timing: 15 minutes, 30 minutes, or 1 hour before opening (data-testid=''reminder-option-15'', ''reminder-option-30'',
    ''reminder-option-60''). Confirm button (data-testid=''confirm-alert-button'') saves alert to localStorage under key ''deld-opening-alerts''
    with structure: { restaurantId, restaurantName, openTime, reminderOffset, createdAt }. After saving, button text changes
    to ''Alert Set'' and clicking it again should NOT open the modal.


    2. **Alerts Management Page**: Create route /user/alerts (data-testid=''alerts-page'') showing active alerts in a list.
    Each alert card (data-testid=''alert-card'') displays restaurant name, scheduled time, and cancel button (data-testid=''cancel-alert-button'').
    Empty state (data-testid=''no-alerts-message'') shows ''No active alerts''.


    **Routes**: /user/alerts


    **Element Selectors**:

    - Reminder option 30: `[data-testid="reminder-option-30"]`

    - Reminder option 60: `[data-testid="reminder-option-60"]`'
hint: '**Files**: ~4 (notify-me-button component, alert-modal component, alerts page, localStorage utility)


  **Authentication**: Not required for alerts (localStorage-based)

  **Preferred Account**: If login is required, please use the following credentials: - Login: sarah.chen@email.com - Password:
  password123


  **localStorage** use following keys in localStorage:

  - `deld-opening-alerts`'
