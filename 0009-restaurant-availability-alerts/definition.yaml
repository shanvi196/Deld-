- name: vlm
  args:
    score_name: screenshot_9_rate_the_notify
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the Notify Me button and tooltip display on a scale of 0 to 1:


      0 - Feature not implemented: No Notify Me button visible on closed restaurant cards, or button exists but no tooltip
      appears on hover, or button appears on open restaurants instead of only closed ones


      1 - Feature correctly implemented: Notify Me button with bell icon visible in the bottom-right area of a closed restaurant
      card, tooltip is displayed above/near the button showing ''Opens at'' followed by a specific time (e.g., ''Opens at
      11:00 AM''), tooltip has dark background with white/light text and appears to have an arrow or pointer toward the button'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 2500))
    - '(function() { const cards = document.querySelectorAll(''[data-testid^="restaurant-card-link-"]''); for (const card
      of cards) { if (card.textContent && card.textContent.includes(''Closed'')) { const notifyBtn = card.querySelector(''[data-testid="notify-me-button"]'');
      if (notifyBtn) { notifyBtn.dispatchEvent(new MouseEvent(''mouseenter'', { bubbles: true })); break; } } } })()'
    - await new Promise(resolve => setTimeout(resolve, 800))
- name: vlm
  args:
    score_name: screenshot_10_rate_the_empty
    screenshot_url: http://localhost:3000/user/alerts
    evaluation_rubric: 'Rate the empty alerts page display on a scale of 0 to 1:


      0 - Page not implemented or broken: 404 error displayed, or page exists but shows no empty state UI, or empty state
      message is missing or uses different text than ''No active alerts''


      1 - Empty state correctly displayed: Alerts page with data-testid=''alerts-page'' is visible, centered empty state container
      is shown with an illustrative icon (bell with slash or similar ''no alerts'' indicator), text displaying exactly ''No
      active alerts'' is visible, empty state is properly centered within the main content area below any navigation header'
    scale:
    - 0
    - 1
    prep_script:
    - (function() { localStorage.removeItem('deld-opening-alerts'); })()
    - await new Promise(resolve => setTimeout(resolve, 2500))
