- name: vlm
  args:
    score_name: screenshot_9_rate_the_review
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the review selection UI on a scale of 0 to 1:


      0 - Selection feature missing: No checkboxes visible on review cards, no way to select reviews, or no Compare button
      visible anywhere on the page.


      1 - Selection feature working: Review cards display checkboxes with data-testid pattern "review-select-checkbox-{id}",
      two reviews are visibly selected (checked checkboxes and/or visual highlight like border), and a Compare button with
      data-testid "compare-selected-button" is visible showing the count (e.g., "Compare (2)").'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - '(function() { const reviewsSection = document.querySelector(''[data-testid="recommended-reviews-section"]''); if (reviewsSection)
      reviewsSection.scrollIntoView({ behavior: ''instant'' }); })()'
    - await new Promise(resolve => setTimeout(resolve, 500))
    - (function() { const checkboxes = document.querySelectorAll('[data-testid^="review-select-checkbox-"]'); if (checkboxes[0])
      checkboxes[0].click(); })()
    - await new Promise(resolve => setTimeout(resolve, 300))
    - (function() { const checkboxes = document.querySelectorAll('[data-testid^="review-select-checkbox-"]'); if (checkboxes[2])
      checkboxes[2].click(); })()
    - await new Promise(resolve => setTimeout(resolve, 500))
- name: vlm
  args:
    score_name: screenshot_10_rate_the_comparison
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the comparison modal on a scale of 0 to 1:


      0 - Modal not visible: No modal/dialog overlay appears on the page, or the page shows an error state, or nothing changed
      after the button click.


      1 - Modal displaying comparison: A modal/dialog with data-testid "review-comparison-modal" is visible overlaying the
      page with a semi-transparent backdrop (data-testid "comparison-modal-backdrop"), displaying 3 reviews in side-by-side
      columns (data-testid "comparison-review-column-0/1/2"). Each column shows review content (rating stars, review text,
      visit type badge). A close button with data-testid "comparison-modal-close" is visible in the modal.'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - (function() { const checkboxes = document.querySelectorAll('[data-testid^="review-select-checkbox-"]'); if (checkboxes[0])
      checkboxes[0].click(); })()
    - await new Promise(resolve => setTimeout(resolve, 300))
    - (function() { const checkboxes = document.querySelectorAll('[data-testid^="review-select-checkbox-"]'); if (checkboxes[1])
      checkboxes[1].click(); })()
    - await new Promise(resolve => setTimeout(resolve, 300))
    - (function() { const checkboxes = document.querySelectorAll('[data-testid^="review-select-checkbox-"]'); if (checkboxes[2])
      checkboxes[2].click(); })()
    - await new Promise(resolve => setTimeout(resolve, 500))
    - (function() { const btn = document.querySelector('[data-testid="compare-selected-button"]'); if (btn && !btn.disabled)
      btn.click(); })()
    - await new Promise(resolve => setTimeout(resolve, 1000))
