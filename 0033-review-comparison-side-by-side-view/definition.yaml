problem_id: 0033-review-comparison-side-by-side-view
app: deld
task:
  prompt: 'Implement a Review Comparison feature for the Deld restaurant app. Users browsing restaurant reviews want to compare
    2-3 reviews side-by-side to better evaluate dining choices.


    **Feature Requirements**:


    1. **Review Selection**: Add checkbox selection to review cards on the restaurant details page. Each review card displays
    a checkbox (data-testid="review-select-checkbox-{reviewId}"). Selected reviews show a visual highlight (e.g., blue border).
    A "Compare Selected" button (data-testid="compare-selected-button") appears when 1+ reviews selected, showing count like
    "Compare (2)". Button is disabled when <2 or >3 selected.


    2. **Comparison Modal**: Clicking "Compare Selected" opens a Radix Dialog modal (data-testid="review-comparison-modal")
    with backdrop (data-testid="comparison-modal-backdrop"). Modal displays selected reviews in side-by-side columns (data-testid="comparison-review-column-0",
    "comparison-review-column-1", etc.). Each column shows: rating stars, review text, visit type badge. Close button (data-testid="comparison-modal-close")
    dismisses modal and clears selection. Clicking backdrop also closes modal and clears selection.


    **Routes**: Restaurant details page at /restaurants/[id]


    **Element Selectors**:

    - Comparison review column 1: `[data-testid="comparison-review-column-1"]`'
hint: '**Files**: ~4 (review card component, comparison modal component, selection state hook, restaurant reviews section)


  **Authentication**: Not required - feature works for all users

  **Preferred Account**: If login is required, please use the following credentials: - Login: sarah.chen@email.com - Password:
  password123'
