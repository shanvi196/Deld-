problem_id: 0013-cuisine-preference-quick-filters
app: deld
task:
  prompt: "Implement Cuisine Preference Quick Filters for the Deld restaurant app.\
    \ Users want quick access to their favorite cuisines without navigating through\
    \ the full filter panel. This feature is only available to logged-in users and\
    \ persists preferences per user in localStorage.\n\n**Feature 1: Quick Filter\
    \ Chips Bar (Home Page)**\n\nAdd a horizontal scrollable container (`data-testid=\"\
    cuisine-quick-filters\"`) positioned below the search bar header and above the\
    \ existing filters sidebar and restaurant list on the home page (`/`). This bar\
    \ is only visible when the user is logged in AND has at least one saved cuisine\
    \ preference.\n\n- Display up to 5 cuisine chips from the user's saved preferences,\
    \ in their saved order (first 5 only).\n- Each chip (`data-testid=\"cuisine-chip-{slug}\"\
    `, e.g., `cuisine-chip-thai`, `cuisine-chip-italian`) displays the cuisine's display\
    \ name from `CATEGORIES_DICTIONARY`.\n- Clicking a chip toggles that cuisine in\
    \ the current URL `categories` param using the existing `setCategories` action\
    \ from `RestaurantsSearchContext`. If the cuisine is already in `categories`,\
    \ remove it; if not, add it.\n- Active chips (cuisine currently present in URL\
    \ `categories`) must show a visually distinct selected state (e.g., filled/highlighted\
    \ background) and have `aria-pressed=\"true\"` set on the element.\n- Include\
    \ a \"Customize\" button (`data-testid=\"customize-cuisines-btn\"`) as the last\
    \ item in the bar, styled distinctly from the chips (e.g., outline style with\
    \ a gear or edit icon).\n- When the user has no saved preferences, the entire\
    \ chips bar must not be rendered in the DOM.\n\n**Feature 2: Customize Preferences\
    \ Modal**\n\nClicking the \"Customize\" button opens a dialog (`data-testid=\"\
    cuisine-prefs-modal\"`).\n\n- Show all of the user's currently saved cuisines\
    \ as an ordered list. Each item displays the cuisine display name with:\n  - A\
    \ drag handle (`data-testid=\"cuisine-drag-handle-{index}\"`, 0-indexed) for reordering\
    \ items via drag-and-drop.\n  - A remove button (`data-testid=\"remove-cuisine-{slug}\"\
    `) that immediately removes that cuisine from the modal's local list state.\n\
    - Below the list, include an \"Add Cuisine\" dropdown/select (`data-testid=\"\
    add-cuisine-select\"`) showing all cuisines from `CATEGORIES_DICTIONARY` that\
    \ are NOT already in the user's current list. Selecting a cuisine appends it to\
    \ the end of the list.\n- Enforce a maximum of 10 cuisines. When the user has\
    \ 10 cuisines, the \"Add Cuisine\" dropdown must be disabled and a message (`data-testid=\"\
    max-cuisines-message\"`) reading \"Maximum 10 cuisines reached\" must be displayed.\n\
    - Display a count label (`data-testid=\"cuisine-count\"`) showing \"{current}/{max}\"\
    \ format (e.g., \"3/10\").\n- \"Save\" button (`data-testid=\"save-cuisine-prefs\"\
    `) persists the ordered list to localStorage and closes the modal. When saving,\
    \ if any cuisines that were removed from the preferences list are currently active\
    \ in the URL `categories` param, those cuisines must also be removed from the\
    \ URL `categories` (bidirectional sync).\n- \"Cancel\" button (`data-testid=\"\
    cancel-cuisine-prefs\"`) discards all unsaved changes and closes the modal, restoring\
    \ the list to its state when the modal was opened.\n\n**Feature 3: \"Matches Your\
    \ Taste\" Badge (Restaurant Detail Page)**\n\nOn each restaurant detail page (`/restaurants/[id]`),\
    \ if the logged-in user has saved cuisine preferences and the restaurant's `cuisine`\
    \ array contains any cuisine matching the user's saved preferences:\n\n- Display\
    \ a badge (`data-testid=\"matches-your-taste-badge\"`) in the restaurant header\
    \ area (near the restaurant name or above the quick action buttons) showing the\
    \ text \"Matches Your Taste\" with a heart icon.\n- Below the badge, render small\
    \ tags for each matching cuisine (`data-testid=\"matched-cuisine-{slug}\"`, e.g.,\
    \ `matched-cuisine-italian`), showing the cuisine display name.\n- This badge\
    \ and tags must only be visible to logged-in users who have at least one saved\
    \ cuisine preference. They must not be rendered for logged-out users or users\
    \ with no saved preferences.\n- If no cuisines match, the badge and tags must\
    \ not be rendered.\n\n**Feature 4: User-Scoped Persistence & Isolation**\n\n-\
    \ localStorage key format: `deld-cuisine-prefs-{userId}` (e.g., `deld-cuisine-prefs-user_0001`\
    \ for Sarah Chen).\n- localStorage value: JSON string with structure `{ \"cuisines\"\
    : [\"italian\", \"thai\", \"japanese\"], \"updatedAt\": \"2024-01-15T14:20:00.000Z\"\
    \ }`\n  - `cuisines`: ordered array of `CategorySlug` strings (the slug keys,\
    \ not display names)\n  - `updatedAt`: ISO-8601 timestamp set to current time\
    \ whenever the user saves changes\n- Each user must see only their own preferences.\
    \ Logging out and logging in as a different user must show that user's preferences\
    \ (or hide the bar if they have none).\n- Preferences must survive page navigation:\
    \ navigating from `/` to `/restaurants/[id]` and back must show the same chips\
    \ bar with the same preferences.\n- Preferences must survive a full page refresh.\n\
    - On first use (no localStorage entry exists for the user), the chips bar is hidden.\
    \ The user must open the Customize modal via some other entry point or the bar\
    \ should not appear until preferences are saved. To handle this bootstrap case:\
    \ if the user is logged in but has no saved preferences, show a single \"Set Cuisine\
    \ Preferences\" link button (`data-testid=\"setup-cuisines-btn\"`) in place of\
    \ the chips bar, which opens the Customize modal.\n\n**Routes**: Home page `/`,\
    \ Restaurant detail page `/restaurants/[id]`\n\n**Auth**: Feature requires login.\
    \ All UI elements for this feature are hidden entirely for logged-out users.\n\
    \n**State**:\n- localStorage `deld-cuisine-prefs-{userId}` — source of truth for\
    \ ordered cuisine preferences\n- URL param `categories` — existing filter param,\
    \ toggled by chip clicks, synced bidirectionally on preference removal via modal\n\
    - No server-side storage — this is a purely client-side feature\n\n**Element Selectors**:\n\
    - Quick filters container: `[data-testid=\"cuisine-quick-filters\"]`\n- Setup\
    \ link (no prefs yet): `[data-testid=\"setup-cuisines-btn\"]`\n- Cuisine chip:\
    \ `[data-testid=\"cuisine-chip-{slug}\"]` (e.g., `cuisine-chip-italian`, `cuisine-chip-thai`)\n\
    - Active chip state: `[data-testid=\"cuisine-chip-{slug}\"][aria-pressed=\"true\"\
    ]`\n- Customize button: `[data-testid=\"customize-cuisines-btn\"]`\n- Modal dialog:\
    \ `[data-testid=\"cuisine-prefs-modal\"]`\n- Drag handle (0-indexed): `[data-testid=\"\
    cuisine-drag-handle-{index}\"]`\n- Remove button: `[data-testid=\"remove-cuisine-{slug}\"\
    ]`\n- Add cuisine dropdown: `[data-testid=\"add-cuisine-select\"]`\n- Max cuisines\
    \ message: `[data-testid=\"max-cuisines-message\"]`\n- Cuisine count label: `[data-testid=\"\
    cuisine-count\"]`\n- Save button: `[data-testid=\"save-cuisine-prefs\"]`\n- Cancel\
    \ button: `[data-testid=\"cancel-cuisine-prefs\"]`\n- Matches badge: `[data-testid=\"\
    matches-your-taste-badge\"]`\n- Matched cuisine tag: `[data-testid=\"matched-cuisine-{slug}\"\
    ]`"
