checklist_items:
- Logged-in users with saved cuisine preferences see a horizontal scrollable bar of
  up to 5 cuisine chips below the search bar on the home page, each showing the cuisine's
  display name, and clicking a chip toggles that cuisine filter in the current search
  results with a visually distinct active/pressed state for selected chips.
- A 'Customize' button appears at the end of the chips bar and opens a modal where
  users can reorder their saved cuisines via drag-and-drop, remove individual cuisines,
  and add new cuisines from a dropdown that only lists cuisines not already saved
  — with a hard cap of 10 cuisines that disables the dropdown and shows a limit message
  when reached.
- Saving changes in the customize modal persists the updated ordered list to localStorage
  under a user-specific key, closes the modal, and automatically removes any deleted
  cuisine preferences from the active URL filters; canceling discards all changes
  and restores the list to its pre-edit state.
- Logged-in users who have no saved preferences see a 'Set Cuisine Preferences' link
  in place of the chips bar that opens the customize modal, and once preferences are
  saved the chips bar replaces that link immediately.
- On each restaurant detail page, if a logged-in user's saved cuisine preferences
  overlap with the restaurant's cuisine tags, a 'Matches Your Taste' badge with a
  heart icon and individual matching cuisine tags appear near the restaurant name
  — and the badge is completely absent when there is no overlap or the user has no
  preferences.
- All cuisine preference UI elements — the chips bar, setup link, customize button,
  and taste-match badge — are completely hidden for logged-out users and do not appear
  in the page.
- 'Cuisine preferences are isolated per user account: logging out and logging in as
  a different user shows only that user''s saved preferences (or hides the bar if
  they have none), with no bleed-through between accounts.'
- Preferences persist across full page refreshes and navigation between the home page
  and restaurant detail pages without loss of data or ordering.
