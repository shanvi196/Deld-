- name: vlm
  args:
    score_name: screenshot_9_rate_the_visual
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the visual appearance of reaction buttons in their default inactive state on a scale of 0 to
      1:


      0 - Reaction buttons not visible: No emoji reaction buttons are displayed below review cards, or buttons are missing
      entirely from the reviews section, or the page failed to load reviews.


      1 - Reaction buttons correctly displayed in inactive state: A horizontal row of 4 emoji reaction buttons (👍 😋 📸 💡) is
      visible below the review text. All buttons appear in a muted/inactive visual style with no highlight or selection indicator.
      Each button shows its emoji followed by the count "0". Buttons are evenly spaced with consistent gaps between them.
      The reaction buttons row is aligned with the review card content.'
    scale:
    - 0
    - 1
    prep_script:
    - window.location.href = 'http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980'
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - '(function() { const reviewsSection = document.querySelector(''[data-testid="recommended-reviews-section"]''); if (reviewsSection)
      { reviewsSection.scrollIntoView({ behavior: ''instant'', block: ''start'' }); } })()'
    - await new Promise(resolve => setTimeout(resolve, 500))
    - window.scrollBy(0, 500);
- name: vlm
  args:
    score_name: screenshot_10_rate_the_visual
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the visual appearance of active versus inactive reaction button states on a scale of 0 to 1:


      0 - No visual distinction between active and inactive states: The clicked "Helpful" (👍) button looks identical to the
      other buttons, or no buttons are visible, or the click did not register any visual change.


      1 - Clear visual distinction between active and inactive states: The "Helpful" (👍) button is visually highlighted with
      a distinct background color, border, or emphasis that differentiates it from the inactive buttons. The count next to
      the "Helpful" emoji displays "1" instead of "0". The other 3 reaction buttons (😋 📸 💡) remain in the muted/inactive visual
      style. The active button has noticeably higher visual prominence through color contrast or styling compared to the inactive
      buttons.'
    scale:
    - 0
    - 1
    prep_script:
    - localStorage.removeItem('review-reactions')
    - window.location.href = 'http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980'
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - '(function() { const reviewsSection = document.querySelector(''[data-testid="recommended-reviews-section"]''); if (reviewsSection)
      { reviewsSection.scrollIntoView({ behavior: ''instant'', block: ''start'' }); } })()'
    - await new Promise(resolve => setTimeout(resolve, 500))
    - window.scrollBy(0, 500);
    - await new Promise(resolve => setTimeout(resolve, 500))
    - (function() { const helpfulBtn = document.querySelector('[data-testid^="reaction-btn-helpful-"]'); if (helpfulBtn) {
      helpfulBtn.click(); } })()
    - await new Promise(resolve => setTimeout(resolve, 1500))
