problem_id: 0019-review-reaction-emoji-system
app: deld
task:
  prompt: 'Implement a Review Reaction Emoji System for the Deld restaurant app. Users should be able to react to reviews
    with emoji reactions to provide quick feedback.


    **Feature Requirements**:


    1. **Reaction Buttons Component**: Add a row of emoji reaction buttons below each review card. Include four reaction types:
    👍 (Helpful), 😋 (Made Me Hungry), 📸 (Great Photos), 💡 (Useful Tips). Each button displays the emoji and its count. Clicking
    a button toggles the user''s reaction on/off. Active reactions must have `aria-pressed="true"` attribute and a visually
    highlighted background. Use data-testid="reaction-buttons-{reviewId}" for the container, data-testid="reaction-btn-helpful-{reviewId}",
    data-testid="reaction-btn-hungry-{reviewId}", data-testid="reaction-btn-photos-{reviewId}", data-testid="reaction-btn-tips-{reviewId}"
    for individual buttons.


    2. **Reaction State Persistence**: Store reactions in localStorage under key ''review-reactions''. Structure: { [reviewId]:
    reactionType } where reactionType is ''helpful''|''hungry''|''photos''|''tips''|null. Display aggregated counts per reaction
    type. Counts should update immediately when user toggles reaction. Use data-testid="reaction-count-{type}-{reviewId}"
    for count displays.


    **Routes**: Restaurant detail page at /restaurants/[id] (existing route)'
hint: '**Files**: ~3-4 files (new ReactionButtons component, ReviewCard integration, localStorage utility)


  **Authentication**: Not required - reactions work for all users

  **Preferred Account**: If login is required, please use the following credentials: - Login: sarah.chen@email.com - Password:
  password123


  **localStorage** use following keys in localStorage:

  - `review-reactions`'
