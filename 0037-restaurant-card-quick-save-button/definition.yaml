checklist_items:
- Each restaurant card on the homepage displays a bookmark icon in the top-right corner
  of its image area; on desktop-wide screens the icon is hidden until hovering over
  the card, while on smaller screens it is always visible.
- Clicking the bookmark icon on a restaurant card opens a save-to-collection dialog
  without navigating away from the homepage; the dialog lists the user's collections
  and allows adding or removing the restaurant from any collection, including creating
  a new collection.
- The bookmark icon appears filled when the restaurant belongs to at least one of
  the user's collections, and reverts to an outline when the restaurant is removed
  from all collections via the dialog.
- When a guest (not logged in) clicks the bookmark icon, they are redirected to the
  login page instead of seeing the save dialog.
- A 'Recently Saved' section appears at the top of the homepage for logged-in users
  who have quick-saved at least one restaurant, showing up to 8 compact cards (image,
  name, rating) in a horizontal scrollable row ordered newest-first, and each card
  navigates to the restaurant's detail page.
- The Recently Saved section persists across full page navigations (e.g., visiting
  a restaurant detail page and pressing back) and across browser refreshes, with data
  stored per user so switching accounts shows each user's own saved list.
- Removing a restaurant from all collections via the save dialog also removes it from
  the Recently Saved section; if no recently saved restaurants remain, the section
  disappears entirely.
- A numeric badge on the user avatar in the header shows the count of unique restaurants
  saved across all collections, updates immediately when restaurants are saved or
  removed, and is hidden when the count is zero.
- Saving a 9th restaurant to the Recently Saved list evicts the oldest entry so that
  no more than 8 restaurants are ever shown in the section.
