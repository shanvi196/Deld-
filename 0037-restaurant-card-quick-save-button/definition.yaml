problem_id: 0037-restaurant-card-quick-save-button
app: deld
task:
  prompt: "Implement a Quick Save Button on Restaurant Cards with a Recently Saved\
    \ Section\n\nUsers browsing restaurants want to quickly save them to collections\
    \ without navigating away from the list view, and see their most recently saved\
    \ restaurants at the top of the homepage for easy access.\n\n## Feature Requirements\n\
    \n### 1. Quick Save Button on Restaurant Cards\n\nAdd a bookmark icon button to\
    \ each `RestaurantCard` on the homepage restaurant list.\n\n- **Button element**:\
    \ `data-testid='quick-save-button-{restaurantId}'` using the Lucide `Bookmark`\
    \ icon.\n- **Positioning**: Absolutely positioned in the **top-right corner**\
    \ of the restaurant card image area (the 168×168 image container).\n- **Hover\
    \ reveal (desktop)**: On screens `xl` and above, the button starts at `opacity-0`\
    \ and transitions to `opacity-100` when the user hovers over the restaurant card\
    \ (`group-hover`). Use a `transition-opacity duration-200` animation. On smaller\
    \ screens, the button is always visible.\n- **Saved state**: If the restaurant\
    \ exists in **any** of the logged-in user's collections, show a **filled** bookmark\
    \ icon (`fill-current` class on the Bookmark SVG). Otherwise, show an **outline**\
    \ bookmark icon.\n- **Click behavior**: Clicking the quick save button must **not**\
    \ navigate to the restaurant detail page. It must stop event propagation and open\
    \ the `SaveToCollectionDialog` for that restaurant. The dialog must have `data-testid='save-to-collection-dialog'`.\n\
    - **Guest users**: If no user is logged in, the quick save button should still\
    \ appear but clicking it navigates to `/login` instead of opening the dialog.\n\
    \n### 2. Save Dialog Integration with Bidirectional State\n\nReuse the existing\
    \ `SaveToCollectionDialog` component, triggered from the quick save button.\n\n\
    - The dialog shows all of the user's collections with the ability to **save**\
    \ (add) or **remove** the restaurant from each collection.\n- When the user **saves**\
    \ the restaurant to a collection:\n  - The quick save button icon updates to the\
    \ **filled** state immediately.\n  - The restaurant is added to the **Recently\
    \ Saved** section (see Requirement 3).\n- When the user **removes** the restaurant\
    \ from a collection via the dialog's \"Remove\" button:\n  - If the restaurant\
    \ is no longer in **any** collection, the quick save button icon reverts to the\
    \ **outline** state.\n  - The restaurant is **removed** from the Recently Saved\
    \ section.\n- The dialog must include a \"Save to a New Collection\" button that\
    \ opens the new collection creation flow, then returns to the save dialog.\n-\
    \ Closing the dialog (clicking outside or pressing Escape) must not navigate away\
    \ from the homepage.\n\n### 3. Recently Saved Section on Homepage\n\nAdd a \"\
    Recently Saved\" section at the top of the homepage (above the main restaurant\
    \ list) that shows restaurants the user has recently quick-saved.\n\n- **Section\
    \ container**: `data-testid='recently-saved-section'`. Rendered only when the\
    \ user is logged in **and** has at least one recently saved restaurant.\n- **Section\
    \ heading**: Display \"Recently Saved\" as a heading with `data-testid='recently-saved-heading'`.\n\
    - **Layout**: A horizontal scrollable row of compact restaurant cards. Each card\
    \ has `data-testid='recently-saved-card-{restaurantId}'` and shows the restaurant\
    \ image (80×80 rounded), name, and rating. Clicking a card navigates to `/restaurants/{restaurantId}`.\n\
    - **Ordering**: Most recently saved first (newest on the left).\n- **Limit**:\
    \ Maximum **8** restaurants displayed. When a 9th restaurant is saved, the **oldest**\
    \ entry is evicted.\n- **localStorage persistence**: The recently saved list must\
    \ be stored in `localStorage` under the key `deld-recently-saved-{userId}` (e.g.,\
    \ `deld-recently-saved-abc123`). The stored value is a JSON array:\n  ```json\n\
    \  [\n    { \"restaurantId\": \"rest-1\", \"savedAt\": \"2025-01-15T10:30:00.000Z\"\
    \ },\n    { \"restaurantId\": \"rest-2\", \"savedAt\": \"2025-01-15T10:25:00.000Z\"\
    \ }\n  ]\n  ```\n  The array must always be sorted by `savedAt` descending (newest\
    \ first) and contain at most 8 entries.\n- **Cross-page persistence**: The recently\
    \ saved data must survive full page navigation (e.g., navigating to a restaurant\
    \ detail page and pressing the browser back button must still show the Recently\
    \ Saved section with correct data).\n- **Bidirectional updates**: When a restaurant\
    \ is removed from **all** collections (via the save dialog), it must also be removed\
    \ from the Recently Saved section and from localStorage. The section should hide\
    \ entirely if the list becomes empty.\n\n### 4. Saved Restaurants Count Badge\
    \ in Header\n\nAdd a numeric badge to the user avatar area in the header showing\
    \ how many unique restaurants the user has saved across all collections.\n\n-\
    \ **Badge element**: `data-testid='saved-count-badge'`, displayed as a small red\
    \ circular badge overlaid on or next to the user avatar trigger button (`data-testid='user-avatar-menu-trigger'`).\n\
    - **Count**: The number of **unique** restaurants across all of the user's collections\
    \ (not total collection items — a restaurant in 2 collections counts as 1).\n\
    - **Visibility**: Only shown when the count is **greater than 0**. Hidden when\
    \ the user has no saved restaurants.\n- **Real-time updates**: The badge count\
    \ must update immediately when a restaurant is saved or removed via the quick\
    \ save dialog (both adding and removing).\n\n## Routes\n\n- **Homepage**: `/`\
    \ — Quick save buttons on cards, Recently Saved section, header badge\n- **Restaurant\
    \ Detail**: `/restaurants/{id}` — Existing save button should reflect same saved\
    \ state (no changes needed, but state must be consistent)\n- **Login**: `/login`\
    \ — Guest users redirected here when clicking quick save\n\n## Auth\n\n- Quick\
    \ save button appears for all users but has different click behavior (dialog for\
    \ logged-in, redirect for guests)\n- Recently Saved section only appears for logged-in\
    \ users\n- Header badge only appears for logged-in users\n- localStorage is keyed\
    \ per user to isolate data between accounts\n\n## State\n\n- **Server state**:\
    \ Collections data via existing TanStack React Query (`userCollectionsQueryOptions`)\n\
    - **Client state**: Recently saved list in `localStorage` key `deld-recently-saved-{userId}`\n\
    - **Derived state**: Quick save button filled/outline derived from collections\
    \ query; badge count derived from unique restaurant count across collections\n\
    - Both localStorage and query cache must stay in sync when saves/removes occur"
