- name: vlm
  args:
    score_name: screenshot_9_rate_the_translate
    screenshot_url: http://localhost:3000/restaurants/285e4e71-fe48-4e5e-bff1-ffa88a2de5a6
    evaluation_rubric: 'Rate the translate button implementation on a scale of 0 to
      1:


      0 - Translate button NOT visible: No button with text ''Translate'' appears
      near review content, or reviews section is not visible, or page failed to load
      properly.


      1 - Translate button visible and properly styled: A ''Translate'' button is
      visible near review text content in the reviews section. The button should be
      styled appropriately (not a plain unstyled link), positioned below or near the
      review text, and visually distinct but not overly prominent compared to the
      review content.'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - (function() { window.scrollTo(0, 600); })()
    - await new Promise(resolve => setTimeout(resolve, 500))
- name: vlm
  args:
    score_name: screenshot_10_rate_the_translated
    max_height: 4000
    screenshot_url: http://localhost:3000/restaurants/285e4e71-fe48-4e5e-bff1-ffa88a2de5a6
    evaluation_rubric: 'Rate the translated content display on a scale of 0 to 1:


      0 - Translation toggle NOT working: After clicking translate button, no translated
      text container appears, or button text did not change to ''Show Original'',
      or translated text does not include ''[Translated]'' prefix, or the translated
      container lacks distinct styling.


      1 - Translation toggle working correctly: After clicking the translate button:
      (1) A translated text container with data-testid ''review-translated-text''
      is visible with distinct styling such as a subtle background color or border
      distinguishing it from the original review, (2) The ''[Translated]'' prefix
      is visible at the start of the translated text, (3) The button text has changed
      from ''Translate'' to ''Show Original'', (4) The original review text remains
      visible above or near the translated container.'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - |
      (function() {
        const element = document.querySelector('[data-testid="review-translate-button"]');
        if (element) {
          element.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      })()
    - await new Promise(resolve => setTimeout(resolve, 500))
    - (function() { const btn = document.querySelector('[data-testid="review-translate-button"]');
      if (btn) btn.click(); })()
    - await new Promise(resolve => setTimeout(resolve, 1000))
