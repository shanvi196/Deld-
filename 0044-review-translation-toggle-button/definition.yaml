problem_id: 0044-review-translation-toggle-button
app: deld
task:
  prompt: 'Implement a Review Translation Toggle feature for the Deld app. Users viewing
    reviews written in non-English languages should be able to see a translated version.


    **Feature Requirements**:


    1. **Translation Button**: Add a ''Translate'' button (data-testid="review-translate-button")
    below reviews detected as non-English. Detect non-English by checking if review
    text contains non-ASCII characters (charCode > 127). Button shows "Translate"
    initially, changes to "Show Original" when translation is displayed.


    2. **Translation Display**: When clicked, toggle between original review text
    and a placeholder translated version. Show translated text in a distinct container
    (data-testid="review-translated-text") with a subtle background (e.g., bg-gray-50
    or bg-muted). Translation state managed in React component state. Display format:
    "[Translated] {original text reversed as placeholder}".


    **Routes**: Restaurant detail page at /restaurant/[id] (e.g., /restaurant/25047088-5a40-4fab-be5c-3ee9a54fb980)


    **Test Data Note**: Seed data contains reviews with non-ASCII characters. Tests
    use restaurant 25047088-5a40-4fab-be5c-3ee9a54fb980.'
hint: '**Files**: ~3 (review-card component, review-text component or new translation
  component)


  **Authentication**: Not required

    **Preferred Account**: If login is required, please use the following credentials:
    - Login: sarah.chen@email.com
    - Password: password123'
