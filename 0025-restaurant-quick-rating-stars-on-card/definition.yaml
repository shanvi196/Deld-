problem_id: 0025-restaurant-quick-rating-stars-on-card
app: deld
task:
  prompt: 'Implement quick rating feature for restaurant cards on the homepage. When
    logged in, users should be able to rate a restaurant directly from its card without
    navigating to the detail page.


    **Feature Requirements**:


    1. **Quick Rating Stars on Card Hover**: When a logged-in user hovers over a restaurant
    card, display an overlay with interactive star icons at `data-testid="quick-rating-overlay"`
    containing 5 clickable stars with `data-testid="quick-rating-star-{1-5}"`. Stars
    should highlight on hover (unfilled gray → filled gold). Stars should not appear
    for logged-out users. Clicking a star opens a confirmation dialog.


    2. **Rating Confirmation Dialog**: After clicking a star, show a Radix Dialog
    with `data-testid="quick-rating-dialog"` displaying the selected rating as filled
    stars, restaurant name, and confirm/cancel buttons (`data-testid="quick-rating-confirm"`
    and `data-testid="quick-rating-cancel"`). Confirming submits a minimal review
    via POST `/api/reviews` with just the rating value. Show toast on result.


    **UI Text Strings (Exact Match Required)**:

    - Confirm button: "Submit Rating"

    - Cancel button: "Cancel"

    - Success toast: "Rating submitted!"

    - Error toast: "Failed to submit rating. Please try again."


    **Routes**: Homepage `/` (existing)'
hint: '**Files**: ~4 (restaurant-card.tsx modification, new quick-rating-overlay component,
  dialog component, mutation integration)


  **Authentication**: Required for rating functionality; logged-out users see no overlay'
