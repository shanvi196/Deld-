- name: vlm
  args:
    score_name: screenshot_9_score_no
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Score 0: No comparison slider visible anywhere on the page.
      Either the toggle button is missing, the slider component was not implemented,
      or clicking the toggle did not activate comparison mode.


      Score 1: ComparisonSlider is visible and functional. The slider container with
      data-testid="comparison-slider-container" is displayed with approximate dimensions
      of 300px width by 200px height. Two overlapping images are visible (before image
      on left, after image on right). A vertical draggable handle/divider is positioned
      at or near the horizontal center (approximately 50% position). The toggle button
      displays "View as Grid" text indicating comparison mode is active. Both before
      and after images are equally split at the center divider line.'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - '(function() { const reviewsList = document.querySelector(''[data-testid="recommended-reviews-section"]'');
      if (reviewsList) { reviewsList.scrollIntoView({ behavior: ''instant'', block:
      ''center'' }); } })()'
    - await new Promise(resolve => setTimeout(resolve, 1000))
    - (function() { const toggleBtn = document.querySelector('[data-testid="comparison-toggle-button"]');
      if (toggleBtn) { toggleBtn.click(); } })()
    - await new Promise(resolve => setTimeout(resolve, 500))
