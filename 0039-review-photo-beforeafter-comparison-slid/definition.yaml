problem_id: 0039-review-photo-beforeafter-comparison-slid
app: deld
task:
  prompt: 'Implement a before/after photo comparison slider for restaurant reviews.
    Users want to showcase food transformation (e.g., dish presentation vs. after
    eating) using a draggable divider.


    **Feature Requirements**:


    1. **ComparisonSlider Component**: Create a reusable comparison slider component
    that displays two images side-by-side with a draggable vertical divider. The slider
    should have a handle with data-testid="comparison-slider-handle" that users can
    drag horizontally to reveal more of either image. Left image shows "before" with
    data-testid="comparison-before-image", right shows "after" with data-testid="comparison-after-image".
    Container has data-testid="comparison-slider-container". Handle starts at 50%
    position. Images should fill the container (300px width, 200px height).


    2. **Comparison Toggle in Review Photos**: When a review has exactly 2 photos,
    show a toggle button with data-testid="comparison-toggle-button" below the photos.
    When toggled ON (text: "View as Comparison"), replace the photo grid with the
    ComparisonSlider showing first photo as before, second as after. When toggled
    OFF (text: "View as Grid"), show the standard photo grid. Toggle state is local
    to the component.


    **Routes**: No new routes needed. Feature displays on restaurant pages at `/restaurants/[id]`.'
hint: '**Files**: ~4 files (ComparisonSlider component, ReviewPhotos modification,
  types if needed, styles if needed).


  **Authentication**: Not required - comparison view is available to all users viewing
  reviews.

    **Preferred Account**: If login is required, please use the following credentials:
    - Login: sarah.chen@email.com
    - Password: password123'
