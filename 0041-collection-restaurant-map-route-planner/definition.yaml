problem_id: 0041-collection-restaurant-map-route-planner
app: deld
task:
  prompt: 'Implement a Route Planner for Collections. On the collection detail page
    (/user/collections/[id]), add route planning functionality.


    **Feature Requirements**:


    1. **Plan Route Button**: Add a "Plan Route" button (data-testid="plan-route-button")
    below the collection info section. When clicked, it calculates an optimized visiting
    order for restaurants using nearest-neighbor algorithm starting from the first
    restaurant. The button should be disabled if fewer than 2 restaurants exist in
    the collection. Display "Not enough restaurants" tooltip when disabled.


    2. **Route Visualization**: When route is planned, render a Leaflet Polyline (data-testid="route-polyline")
    connecting restaurant markers in the optimized order. Show route stats panel (data-testid="route-stats")
    displaying total number of stops and estimated total distance in miles (sum of
    straight-line distances). Add "Clear Route" button (data-testid="clear-route-button")
    to remove the polyline and stats.


    **Routes**: /user/collections/[id] (existing page, add components)


    **Element Selectors**:
    - Remove restaurant 0: `[data-testid="remove-restaurant-0"]`
    - Leaflet marker icon: CSS class `leaflet-marker-icon`'
hint: '**Files**: ~4 (route-planner component, distance utility, collection detail
  page integration, polyline component)


  **Authentication**: Required (collections are user-specific)'
