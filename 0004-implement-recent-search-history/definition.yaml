checklist_items:
- When a user submits a search on the homepage, the query and location are saved and
  immediately appear as a clickable chip in a 'Recent Searches' section between the
  search bar and the restaurant list; searching the same query+location again moves
  it to the front rather than creating a duplicate, and only the five most recent
  unique searches are retained.
- Each recent search chip displays the query text followed by a bullet separator and
  the location when a location was provided (e.g., 'sushi · San Francisco, CA'), or
  just the query text when no location was given; chips with only empty or whitespace-only
  query and location fields are never stored or displayed.
- Clicking the × button on an individual chip removes only that search from the list
  without triggering any navigation or search, and clicking the 'Clear History' button
  removes all saved searches and hides the entire recent searches section immediately.
- Clicking a recent search chip on the homepage populates both the search query and
  location inputs with the saved values, triggers the search, and updates the URL
  parameters accordingly; clicking a chip on the restaurant detail page navigates
  to the homepage with the correct query and location parameters pre-filled.
- The restaurant detail page displays a 'Your Recent Searches' section positioned
  above the 'People also searched for' area in the left panel, showing the same set
  of recent searches with the same chip format, individual remove buttons, and a clear-all
  button; this section is hidden when no searches are saved.
- Search history persists across page reloads and navigation — searches saved on the
  homepage appear on the restaurant detail page and vice versa, and removing a search
  on either page is reflected when returning to the other page.
- Logged-in users see their own separate search history tied to their account, while
  logged-out users see a guest history; logging in switches immediately to the authenticated
  user's history (without migrating guest searches), and logging out switches back
  to the guest history.
- Whitespace is trimmed from both query and location fields before saving, so searches
  like '  sushi  ' and 'sushi' are treated as the same entry and do not create duplicates.
