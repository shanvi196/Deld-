problem_id: 0032-dietary-compatibility-score
app: deld
task:
  prompt: 'Implement a Dietary Compatibility Score feature for the Deld restaurant
    discovery app. Users with dietary preferences want to quickly see how well a restaurant
    matches their dietary needs.


    **Feature Requirements**:


    1. **Compatibility Score Calculation**: Create a client-side utility function
    that calculates a dietary compatibility percentage (0-100%) by comparing the logged-in
    user''s `preferences.dietaryRestrictions` array against the restaurant''s `dietaryOptions`
    array. Score = (matched options / user restrictions) * 100. If user has no restrictions,
    score is 100%. Store utility in `/src/utils/restaurants/calculate-dietary-score.ts`.
    Function signature: `calculateDietaryScore(restaurant: Restaurant, userRestrictions:
    string[]): number`.


    2. **Score Display on Restaurant Cards**: Display the compatibility score as a
    circular progress indicator on each restaurant card (visible only when user is
    logged in and has dietary restrictions). Add component at `/src/components/atoms/dietary-score-badge/dietary-score-badge.tsx`.
    Show percentage inside circle. Use green (>=70%), yellow (40-69%), red (<40%)
    colors. Add `data-testid="dietary-score-badge"` to badge container, `data-testid="dietary-score-value"`
    to percentage text.


    **Routes**: Homepage `/` (where restaurant cards display)'
hint: '**Files**: ~3-4 (utility function, badge component, restaurant card integration)


  **Authentication**: Score only displays for logged-in users with dietary restrictions'
