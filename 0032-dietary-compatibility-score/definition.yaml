- name: vlm
  args:
    score_name: screenshot_9_rate_the_dietary
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the dietary score badge display on a scale of 0 to 1:


      0 - Badges not visible or malformed: No circular dietary compatibility score
      badges appear on restaurant cards, OR badges exist but don''t display percentage
      values, OR badges are not properly positioned on cards, OR badges lack color
      coding.


      1 - Badges correctly displayed: Restaurant cards show circular dietary compatibility
      score badges with percentage values (e.g., ''75%'', ''50%'', ''100%'') visible
      inside each badge. Badges are properly positioned on the restaurant cards and
      use appropriate color coding: green for high scores (>=70%), yellow/amber for
      medium scores (40-69%), or red for low scores (<40%). Badges are visually distinct
      with circular shape.'
    scale:
    - 0
    - 1
    prep_script:
    - '(function() { var user = { id: ''user_0001'', email: ''sarah.chen@email.com'',
      preferences: { dietaryRestrictions: [''vegetarian'', ''gluten-free''] } }; document.cookie
      = ''user='' + encodeURIComponent(JSON.stringify(user)) + ''; path=/''; })()'
    - await new Promise(resolve => setTimeout(resolve, 3000))
- name: vlm
  args:
    score_name: screenshot_10_rate_whether_dietary
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate whether dietary score badges are correctly hidden for
      logged out users on a scale of 0 to 1:


      0 - Badges incorrectly shown: Dietary score badges with percentages are visible
      on restaurant cards even though user is not logged in. This indicates the feature
      is not properly checking authentication state.


      1 - Badges correctly hidden: Restaurant cards are visible showing normal content
      (restaurant image, name, rating, cuisine type, price range) but NO circular
      dietary compatibility score badges or percentage indicators appear anywhere
      on the cards. Cards display their standard layout without score overlays.'
    scale:
    - 0
    - 1
    prep_script:
    - (function() { document.cookie = 'user=; path=/; expires=Thu, 01 Jan 1970 00:00:00
      GMT'; })()
    - await new Promise(resolve => setTimeout(resolve, 2500))
