  task_type: feature-implementation
  description: Fix the restaurant-photos-gallery layout on `/restaurants/[id]` to
    use a masonry grid with dynami...
  intent: 133
checklist_items:
- The restaurant detail page displays a photo gallery section below the existing photos
  carousel in the left panel, showing all restaurant photos (general, menu, and food
  images) combined into a single masonry-style grid layout
- A count badge above the gallery shows the total number of photos with correct pluralization
  (e.g. '24 Photos' or '1 Photo')
- 'The gallery grid is responsive: it displays 1 column on narrow screens (below 640px),
  2 columns on medium screens (640–1024px), and 3 columns on wide screens (above 1024px),
  with consistent 8px spacing between photos'
- Photos render at their natural aspect ratio without cropping, and shorter columns
  receive the next photo so that column heights stay roughly balanced (masonry behavior)
- When a restaurant has more than 12 photos, only the first 12 are shown initially
  with a toggle button below them labeled 'Show All (N)'; clicking it reveals all
  photos and the button changes to 'Show Less', clicking again collapses back to 12
- When a restaurant has 12 or fewer photos, all photos are displayed and no toggle
  button appears
- When a restaurant has no photos, the gallery area shows an empty state message reading
  'No photos yet'; when exactly one photo exists, it spans the full width of the gallery
- Each photo loads lazily and shows a light gray placeholder rectangle until the image
  finishes loading, preventing layout shifts as images appear
