problem_id: 1425-maint-fix-restaurant-photos-gallery-layout-to-deld
app: deld
task:
  prompt: 'Fix the restaurant-photos-gallery layout on `/restaurants/[id]` to use
    a masonry grid with dynamic column count and photo management features.


    **Feature Requirements**:


    1. **Masonry Photo Gallery with Count Badge**: Add a gallery section (`data-testid="photo-gallery"`)
    to the restaurant detail page left panel, below the existing photos carousel.
    Aggregate all restaurant photos (general, menu urls, food urls) into a single
    masonry grid. Photos from different categories may share the same URL; include
    all entries without deduplication. Implement CSS grid with a shortest-column placement
    algorithm — no external masonry library. Each photo (`data-testid="gallery-photo-{index}"`)
    renders at natural aspect ratio with no cropping. Display a count badge (`data-testid="gallery-photo-count"`)
    above the grid showing "{N} Photos" (e.g. "15 Photos", or "1 Photo" for singular).
    Responsive columns: 1 below 640px, 2 at 640–1024px, 3 above 1024px. Gap: 8px.


    2. **Show All / Show Less Toggle**: When more than 12 photos exist, initially
    show only the first 12. Render a toggle button (`data-testid="gallery-toggle"`)
    below visible photos with text "Show All ({N})" when collapsed (N = total count)
    and "Show Less" when expanded. Clicking alternates between 12 and all. Hide the
    toggle when 12 or fewer photos.


    3. **Edge States & Lazy Placeholders**: Zero photos: render empty state (`data-testid="gallery-empty-state"`)
    with text "No photos yet". One photo: render full-width spanning all columns.
    Each photo uses `loading="lazy"` and shows a placeholder div (`data-testid="photo-placeholder-{index}"`,
    background `#e5e7eb`) while the image loads.


    **Route**: `/restaurants/[id]` — public, no authentication required

    **State**: Component-local only (useState for toggle expanded/collapsed)'
hint: "**Files**: ~6 files — new gallery component directory with sub-components,\
  \ layout integration\n\n  **Preferred Account**: If login is required, please use\
  \ the following credentials:\n  - Login: sarah.chen@email.com\n  - Password: password123"
