problem_id: 0043-review-reading-time-estimate-badge
app: deld
task:
  prompt: 'Implement a reading time estimate badge for reviews. Users want to quickly
    gauge how long a review will take to read before diving in.


    **Feature Requirements**:


    1. **Reading Time Utility**: Create `src/utils/text/calculate-reading-time.ts`
    utility function. It should calculate reading time from text word count using
    200 words-per-minute average. Return object with `minutes` (number) and `display`
    (formatted string like "2 min read"). For texts under 1 minute, show "1 min read".


    2. **Reading Time Badge**: Display the reading time badge next to the review date
    in ReviewStars component (`src/components/molecules/review-card/review-stars/review-stars.tsx`).
    Use existing Tag component from `@/components/atoms/tag/tag`. Badge should show
    formatted reading time (e.g., "2 min read") with data-testid="reading-time-badge".


    **Routes**: Restaurant detail page `/restaurants/[id]` (reviews section)'
hint: '**Files**: ~3 (utility function, ReviewStars component, pass review text prop)


  **Authentication**: Not required

    **Preferred Account**: If login is required, please use the following credentials:
    - Login: sarah.chen@email.com
    - Password: password123'
