- name: vlm
  args:
    score_name: screenshot_9_rate_the_reading
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the reading time badge display on restaurant reviews
      on a scale of 0 to 1:


      0 - Reading time badges NOT visible: No reading time badges appear next to review
      dates, OR the reviews section is not loaded, OR badges are missing from review
      cards entirely


      1 - Reading time badges correctly displayed: Reading time badges appear as small
      neutral-colored tags (similar to Tag component styling with neutral-100 background),
      badges show text like "X min read" format, badges are positioned in the same
      row as the review date and star rating, layout shows stars/date/reading-time-badge
      in a horizontal arrangement without disrupting the existing review card layout'
    scale:
    - 0
    - 1
    prep_script:
    - window.location.href = 'http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980'
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - '(function() { const reviewsSection = document.querySelector(''[data-testid="recommended-reviews-section"]'')
      || document.querySelector(''[data-testid="reviews-list"]'') || document.querySelector(''.reviews'');
      if (reviewsSection) { reviewsSection.scrollIntoView({ behavior: ''instant'',
      block: ''start'' }); } })()'
    - await new Promise(resolve => setTimeout(resolve, 1000))
