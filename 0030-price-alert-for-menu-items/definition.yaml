problem_id: 0030-price-alert-for-menu-items
app: deld
task:
  prompt: 'Implement a price alert feature for menu items. Users want to track when menu item prices change.


    **Feature Requirements**:


    1. **Alert Button & Modal**: Add an ''Alert me'' button (data-testid=''alert-me-button'') next to each menu item price on the restaurant detail page menu section. Clicking opens a modal (data-testid=''price-alert-modal'') with an input for target price (data-testid=''target-price-input'') and save button (data-testid=''save-alert-button''). Validation: target price must be below current price - if not, show error ''Target price must be below current price'' and don''t save. Save to localStorage key ''priceAlerts'' as array of {restaurantId, menuItemId, menuItemName, targetPrice, currentPrice, createdAt}.


    2. **Alerts Management Page**: Create /user/alerts route (auth required) showing all saved alerts in a list (data-testid=''alerts-list''). Each alert card (data-testid=''alert-card'') displays: menu item name, restaurant name, current price, target price, and status indicator (data-testid=''alert-status'') showing ''Price dropped!'' if currentPrice <= targetPrice, else ''Watching''. Include delete button (data-testid=''delete-alert-button'') to remove alerts.


    **Routes**: /user/alerts (new, authenticated)


    **Element Selectors**:

    - Menu item: `[data-testid^="menu-item-"]`'
hint: '**Files**: ~4 (menu item component, alert modal, alerts page, localStorage utility)


  **Authentication**: Required for /user/alerts page


  **localStorage** use following keys in localStorage:

  - `priceAlerts`'
