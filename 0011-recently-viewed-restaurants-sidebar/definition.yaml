- name: vlm
  args:
    score_name: screenshot_9_rate_the_recently
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the Recently Viewed Restaurants sidebar with populated data on a scale of 0 to 1:


      0 - Sidebar missing or broken: No sidebar visible on the right side of the page, or sidebar exists but shows no restaurant
      cards despite sessionStorage having 8 entries, or major visual/layout issues preventing proper display


      1 - Sidebar correctly displays populated state: Sidebar visible on right side with data-testid=''recent-views-sidebar'',
      8 restaurant cards displayed vertically showing names (Golden Dragon, Pasta Palace, Sushi Master, etc.) and cuisine
      types, collapse/expand toggle button present with data-testid=''recent-views-toggle'', cards are clickable and display
      restaurant information clearly'
    scale:
    - 0
    - 1
    prep_script:
    - '(async () => { const mockData = [{ restaurantId: ''25047088-5a40-4fab-be5c-3ee9a54fb980'', name: ''Marisco Grill'',
      cuisine: ''Chinese'', timestamp: Date.now() }, { restaurantId: ''4f3833e0-ef7d-44fe-ba19-a31447f4d493'', name: ''The
      Franklin Room'', cuisine: ''Italian'', timestamp: Date.now() - 1000 }, { restaurantId: ''rest_0003'', name: ''Sushi
      Master'', cuisine: ''Japanese'', timestamp: Date.now() - 2000 }, { restaurantId: ''25047088-5a40-4fab-be5c-3ee9a54fb980'',
      name: ''Marisco Grill'', cuisine: ''Mexican'', timestamp: Date.now() - 3000 }, { restaurantId: ''25047088-5a40-4fab-be5c-3ee9a54fb980'',
      name: ''Marisco Grill'', cuisine: ''American'', timestamp: Date.now() - 4000 }, { restaurantId: ''25047088-5a40-4fab-be5c-3ee9a54fb980'',
      name: ''Marisco Grill'', cuisine: ''Indian'', timestamp: Date.now() - 5000 }, { restaurantId: ''25047088-5a40-4fab-be5c-3ee9a54fb980'',
      name: ''Marisco Grill'', cuisine: ''Italian'', timestamp: Date.now() - 6000 }, { restaurantId: ''25047088-5a40-4fab-be5c-3ee9a54fb980'',
      name: ''Marisco Grill'', cuisine: ''Thai'', timestamp: Date.now() - 7000 }]; sessionStorage.setItem(''deld-recent-views'',
      JSON.stringify(mockData)); })();'
    - await new Promise(resolve => setTimeout(resolve, 3000));
- name: vlm
  args:
    score_name: screenshot_10_rate_the_empty
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the empty state of the Recently Viewed Restaurants sidebar on a scale of 0 to 1:


      0 - Empty state incorrect or missing: Sidebar not visible at all, or no empty state message displayed when sessionStorage
      is empty, or sidebar shows restaurant cards despite empty sessionStorage, or layout is broken


      1 - Empty state correctly displayed: Sidebar visible with data-testid=''recent-views-sidebar'', element with data-testid=''recent-views-empty''
      shows ''No recent views'' message prominently, sidebar maintains proper width and layout on right side of page, toggle
      button may or may not be visible in empty state'
    scale:
    - 0
    - 1
    prep_script:
    - sessionStorage.removeItem('deld-recent-views');
    - await new Promise(resolve => setTimeout(resolve, 3000));
