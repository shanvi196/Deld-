problem_id: 0011-recently-viewed-restaurants-sidebar
app: deld
task:
  prompt: 'Implement a Recently Viewed Restaurants sidebar for the Deld app. Users want quick access to restaurants they''ve
    recently browsed during their session.


    **Feature Requirements**:


    1. **Session History Tracking**: When a user views a restaurant details page, automatically save that restaurant to sessionStorage
    under key ''deld-recent-views''. Store: restaurantId, name, cuisine (first item), and timestamp. Limit to last 8 unique
    restaurants (newest first, no duplicates - if restaurant already exists, update its timestamp and move to front).


    2. **Recent Views Sidebar**: Add a collapsible sidebar on the right side of the home page (data-testid="recent-views-sidebar").
    Show thumbnail cards with restaurant name and cuisine (data-testid="recent-view-card-{restaurantId}"). Include collapse/expand
    toggle button (data-testid="recent-views-toggle") that persists collapsed state to sessionStorage key ''deld-recent-views-collapsed''.
    Show "No recent views" when empty (data-testid="recent-views-empty"). Clicking a card navigates to that restaurant''s
    details page and updates the view order.


    **Routes**: Home page (/) with new sidebar component


    **Element Selectors**: - Recent view card rest_0001: `[data-testid="recent-view-card-rest_0001"]` - Recent view card rest_0002:
    `[data-testid="recent-view-card-rest_0002"]`'
hint: '**Files**: ~4 (restaurant detail page tracking, sidebar component, sessionStorage utility, home page layout)


  **Authentication**: Not required (works for all users)

  **Preferred Account**: If login is required, please use the following credentials: - Login: sarah.chen@email.com - Password:
  password123'
