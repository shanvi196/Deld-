problem_id: 0018-rating-filter-quick-chips
app: deld
task:
  prompt: 'Implement Rating Filter Quick Chips for restaurant reviews. Users want to quickly filter displayed reviews by star
    rating without reloading.


    **Feature Requirements**:


    1. **Rating Chips Component**: Add clickable rating filter chips below the reviews section header. Display three chips:
    "5★", "4★+", "3★+". Each chip shows count of matching reviews in parentheses (e.g., "5★ (12)"). Chips styled as toggle
    pills with data-testid="rating-chip-5", data-testid="rating-chip-4", data-testid="rating-chip-3". Active chip has highlighted
    background. Clicking active chip deselects it (shows all reviews).


    2. **Review Filtering Behavior**: When chip clicked, filter the currently displayed reviews client-side using React state.
    Only show reviews with rating >= selected threshold. Update visible review count. Maintain current pagination when navigating
    between pages.


    **Routes**: Restaurant detail page `/restaurants/[id]` (existing)'
hint: '**Files**: ~3-4 (reviews section component, rating chips component, review filtering hook)

  **Preferred Account**: If login is required, please use the following credentials: - Login: sarah.chen@email.com - Password:
  password123'
