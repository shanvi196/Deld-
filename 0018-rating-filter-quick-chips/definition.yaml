- name: vlm
  args:
    score_name: screenshot_9_rate_the_rating
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the rating filter chips display on a scale of 0 to 1:


      0 - Chips missing or malformed: Rating filter chips not visible below reviews header, fewer than 3 chips displayed,
      chips missing review counts in parentheses, chips not styled as pill-shaped buttons.


      1 - Chips correctly displayed: Exactly 3 rating filter chips visible below reviews section header showing "5★ (N)",
      "4★+ (N)", "3★+ (N)" where N is a number. All chips appear with light gray/neutral background indicating inactive state.
      Chips styled as horizontally-aligned pill-shaped toggle buttons with rounded corners. Reviews list visible below the
      chips.'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - '(function() { const section = document.querySelector(''[data-testid="recommended-reviews-section"]''); if (section)
      section.scrollIntoView({ behavior: ''instant'', block: ''start'' }); })()'
    - await new Promise(resolve => setTimeout(resolve, 500))
- name: vlm
  args:
    score_name: screenshot_10_rate_the_active
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the active rating chip and filtered reviews display on a scale of 0 to 1:


      0 - Chip not active or reviews not filtered: The 5-star rating chip does not have a highlighted/selected appearance,
      other chips (4★+, 3★+) appear active, reviews are not filtered to show only 5-star reviews, no visual distinction between
      active and inactive chip states.


      1 - Chip active and reviews filtered: The "5★" chip displays with a highlighted/active state (blue or primary-colored
      background clearly different from gray inactive chips). The "4★+" and "3★+" chips display with light gray inactive backgrounds.
      Only review cards showing 5 filled star icons are visible in the reviews list. Active chip styling clearly differentiates
      from inactive chips.'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - '(function() { const section = document.querySelector(''[data-testid="recommended-reviews-section"]''); if (section)
      section.scrollIntoView({ behavior: ''instant'', block: ''start'' }); })()'
    - await new Promise(resolve => setTimeout(resolve, 500))
    - (function() { const chip = document.querySelector('[data-testid="rating-chip-5"]'); if (chip) chip.click(); })()
    - await new Promise(resolve => setTimeout(resolve, 1000))
    - window.scrollBy(0, 500);
    - await new Promise(resolve => setTimeout(resolve, 1000))
