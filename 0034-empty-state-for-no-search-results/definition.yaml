problem_id: 0034-empty-state-for-no-search-results
app: deld
task:
  prompt: 'Implement an Empty Search State component for the restaurant search. When
    a search with filters returns zero restaurants, display a friendly empty state
    instead of an empty list.


    **Feature Requirements**:


    1. **EmptySearchState Component**: Create `src/components/organisms/restaurants-list/empty-search-state.tsx`.
    Display centered layout with: placeholder image from `/placeholder.svg` with data-testid="empty-state-image",
    heading "No restaurants found" with data-testid="empty-state-heading", subtext
    "Try adjusting your filters" with data-testid="empty-state-subtext", and a "Clear
    filters" button with data-testid="clear-filters-button" that calls clearFilters
    from RestaurantsSearchContext.


    2. **Integration with Search Results**: Modify `src/components/organisms/restaurants-list/client-side.tsx`
    to render EmptySearchState with data-testid="empty-search-state" when restaurants.length
    === 0 AND at least one filter is active (check price, categories, features, openNow,
    distance, or query params). Existing NoResultsForLocation/NoResultsForSearchTerm
    remain for location-specific cases.


    **Routes**: Homepage search at `/` (localhost:3000)


    **Element Selectors**:
    - Price filter 1: `[data-testid="price-filter-1"]`
    - Category filter italian: `[data-testid="category-filter-italian"]`'
hint: '**Files**: ~3 (create empty-search-state.tsx, modify client-side.tsx, reference
  restaurants-search-context.tsx)


  **Authentication**: Not required

    **Preferred Account**: If login is required, please use the following credentials:
    - Login: sarah.chen@email.com
    - Password: password123'
