- name: vlm
  args:
    score_name: screenshot_9_evaluate_the_empty
    screenshot_url: http://localhost:3000/?categories=gastropub&price=%24%24%24%24
    evaluation_rubric: 'Evaluate the empty search state display on a scale of 0 to
      1:


      0 - Empty state not visible or broken: No empty state container shown, error
      messages displayed, broken layout, missing components, or still showing restaurant
      cards despite filter combination


      1 - Empty state correctly displayed: Empty state container visible and vertically
      centered in content area, placeholder image displayed above heading, ''No restaurants
      found'' heading visible below image, ''Try adjusting your filters'' subtext
      visible below heading, ''Clear filters'' button visible below subtext, clean
      centered layout with proper spacing between elements'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 3000))
- name: vlm
  args:
    score_name: screenshot_10_evaluate_the_state
    screenshot_url: http://localhost:3000/?categories=gastropub&price=%24%24%24%24
    evaluation_rubric: 'Evaluate the state after clicking Clear filters button on
      a scale of 0 to 1:


      0 - Failed to clear filters: Empty search state still visible, no restaurant
      cards displayed, URL still contains filter parameters, error state shown, or
      page not responding to button click


      1 - Filters cleared successfully: Empty search state no longer visible, restaurant
      cards displayed in a grid layout, at least one restaurant card visible with
      data-testid starting with ''restaurant-card'', URL no longer contains ''categories=gastropub''
      or ''price=%24%24%24%24'' parameters, normal search results layout restored'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - (function() { const btn = document.querySelector('[data-testid="clear-filters-button"]');
      if (btn) btn.click(); })()
    - await new Promise(resolve => setTimeout(resolve, 2000))
