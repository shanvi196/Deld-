- name: vlm
  args:
    score_name: screenshot_9_rate_the_request
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the Request Photo button styling in the menu section on a scale of 0 to 1:


      0 - Request Photo buttons missing or incorrect: No ''Request Photo'' buttons visible on menu items without photos, OR buttons lack outline variant styling (should have visible border, not filled background), OR buttons are positioned incorrectly (not below menu item names), OR button styling is inconsistent across menu items (different sizes, fonts, or padding)


      1 - Request Photo buttons correctly styled: ''Request Photo'' buttons are visible on menu items that lack photos, buttons use outline variant styling with visible border and transparent/light background, buttons are positioned consistently below menu item names, buttons have uniform padding and font size across all displayed menu items, menu items with existing photos do not show the request photo button'
    scale:
    - 0
    - 1
    prep_script:
    - localStorage.removeItem('photo-requests')
    - await new Promise(resolve => setTimeout(resolve, 2500))
    - '(function() { const menuSection = document.querySelector(''[data-testid="menu-section"]'') || document.querySelector(''section:has([data-testid^="request-photo-btn-"])'') || Array.from(document.querySelectorAll(''section'')).find(s => s.textContent && s.textContent.includes(''Menu'')); if (menuSection) { menuSection.scrollIntoView({ behavior: ''instant'', block: ''center'' }); } })()'
    - await new Promise(resolve => setTimeout(resolve, 500))
- name: vlm
  args:
    score_name: screenshot_10_rate_the_requested
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the requested state display with disabled button and count badge on a scale of 0 to 1:


      0 - Requested state incorrect or missing: Buttons do not show ''Requested'' text for items with existing requests in localStorage, OR buttons with requests are not in a disabled/gray state, OR no count badge is visible next to buttons with requests, OR the badge does not display the correct count number, OR the badge styling does not use Tag component styling (should have contrasting background color to stand out)


      1 - Requested state correctly displayed: Buttons for menu items with existing requests show text ''Requested'' in a disabled gray state (muted colors, not interactive appearance), a Tag-styled badge is visible next to or near buttons displaying the request count, the badge uses contrasting colors that stand out from the button (typically a colored background with white or dark text), the overall layout clearly indicates which items have been requested with request count visible'
    scale:
    - 0
    - 1
    prep_script:
    - '(function() { const requests = []; const menuItemId = ''menu_001''; for (let i = 0; i < 5; i++) { requests.push({ restaurantId: ''25047088-5a40-4fab-be5c-3ee9a54fb980'', menuItemId: menuItemId, timestamp: Date.now() - (i * 1000) }); } localStorage.setItem(''photo-requests'', JSON.stringify(requests)); })()'
    - await new Promise(resolve => setTimeout(resolve, 2500))
    - '(function() { const menuSection = document.querySelector(''[data-testid="menu-section"]'') || document.querySelector(''section:has([data-testid^="request-photo-btn-"])'') || Array.from(document.querySelectorAll(''section'')).find(s => s.textContent && s.textContent.includes(''Menu'')); if (menuSection) { menuSection.scrollIntoView({ behavior: ''instant'', block: ''center'' }); } })()'
    - await new Promise(resolve => setTimeout(resolve, 500))
