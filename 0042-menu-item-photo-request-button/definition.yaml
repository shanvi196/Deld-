problem_id: 0042-menu-item-photo-request-button
app: deld
task:
  prompt: 'Implement a ''Request Photo'' feature for menu items without photos. When viewing a restaurant''s menu section, items that lack photos should display a ''Request Photo'' button. Clicking it stores a request in localStorage under ''photo-requests'' as an array of objects with {restaurantId, menuItemId, timestamp}. After requesting, show a badge with the count of requests for that item.


    **Feature Requirements**:


    1. **Request Photo Button**: Add a clickable button with text ''Request Photo'' (data-testid=''request-photo-btn-{menuItemId}'') on menu items missing photos. Button uses outline variant styling. On click, save request to localStorage key ''photo-requests'' with structure {restaurantId: string, menuItemId: string, timestamp: number}. Button should be disabled after clicking with text ''Requested'' (data-testid=''photo-requested-badge-{menuItemId}'').


    2. **Request Count Badge**: Display a count badge (data-testid=''photo-request-count-{menuItemId}'') showing total requests for each item from localStorage. Badge appears next to the button. Uses Tag atom component. Count updates on page load by reading localStorage.


    **Routes**: /restaurants/[id] (existing restaurant detail page)


    **Element Selectors**:
    - Photo request count: `[data-testid="photo-request-count-${menuItemId}"]`
    - Request photo btn: `[data-testid="request-photo-btn-${menuItem2}"]`
    - Photo requested badge: `[data-testid="photo-requested-badge-${menuItemId}"]`
    - Photo request count: `[data-testid="photo-request-count-${menuItem2}"]`
    - Menu section: `[data-testid="menu-section"]`'
hint: '**Files**: ~3-4 (restaurant menu component modification, new photo-request-button component, localStorage utility)


  **Authentication**: Not required

  **Preferred Account**: If login is required, please use the following credentials: - Login: sarah.chen@email.com - Password: password123


  **localStorage** use following keys in localStorage:

  - `photo-requests`'
