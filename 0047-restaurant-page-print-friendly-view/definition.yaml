- name: vlm
  args:
    score_name: screenshot_9_rate_the_print
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the print button display in the QuickActionButtons section on a scale of 0 to 1:


      0 - Print button missing or incorrectly placed: The quick action buttons section does not show a Print button, OR the
      Print button is not visible in the action buttons area, OR no Printer icon is visible next to the ''Print'' text.


      1 - Print button correctly implemented: The Print button is clearly visible in the quick action buttons section alongside
      other action buttons (like Write Review or Save). The button has an outline style with visible border. The Printer icon
      is visible to the left of the ''Print'' text label.'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 2500))
- name: vlm
  args:
    score_name: screenshot_10_rate_the
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the print-content wrapper area on a scale of 0 to 1:


      0 - Print content wrapper missing or incomplete: There is no visible print-content wrapper element on the page, OR the
      wrapper does not contain essential restaurant information (name, address, hours, rating). The layout does not appear
      structured for printing.


      1 - Print content wrapper correctly implemented: A print-content wrapper area is visible containing the essential restaurant
      information. The restaurant name is prominently displayed. Address information is visible. Opening hours information
      is present. Rating information is shown. The content is laid out in a clean, structured format suitable for printing.'
    scale:
    - 0
    - 1
    prep_script:
    - window.location.href = 'http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980';
    - await new Promise(resolve => setTimeout(resolve, 2500))
    - (function () { const el = document.querySelector('[data-testid="print-button"]'); if (el) { el.click(); } })();
