problem_id: 0047-restaurant-page-print-friendly-view
app: deld
task:
  prompt: 'Implement a print-friendly view for restaurant detail pages. Users want to print restaurant information for offline
    reference when planning visits.


    **Feature Requirements**:


    1. **Print Button**: Add a ''Print'' button in the QuickActionButtons section (data-testid=''print-button''). Use outline
    variant with Printer icon from lucide-react. Clicking triggers window.print().


    2. **Print Stylesheet**: Create CSS @media print rules in globals.css. Hide navigation, map, sidebar elements. Show clean
    layout with: restaurant name, full address, hours table, rating, phone/website. Use data-testid=''print-content'' wrapper
    for printable area.


    **Routes**: /restaurants/[id] (existing)


    **Element Selectors**: - Map container: `[data-testid="map-container"]` - Main navigation: `[data-testid="main-navigation"]`'
hint: '**Files**: ~4 (quick-action-buttons.tsx, print-button component, globals.css, restaurant detail page)


  **Authentication**: Not required

  **Preferred Account**: If login is required, please use the following credentials: - Login: sarah.chen@email.com - Password:
  password123'
