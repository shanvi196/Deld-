problem_id: 0029-review-photo-tagging-with-dish-names
app: deld
task:
  prompt: 'Implement review photo tagging with dish names for the Deld restaurant
    reviews app. Users should be able to tag uploaded review photos with specific
    dishes from the restaurant''s menu.


    **Feature Requirements**:


    1. **Photo Dish Tagging UI**: After uploading photos in the write review form,
    display a dish tag selector for each photo. Show a combobox/dropdown with data-testid=''photo-dish-selector-{index}''
    containing menu items from the restaurant. Each photo thumbnail should have a
    tag button with data-testid=''photo-tag-button-{index}''. When a dish is selected,
    show the dish name badge on the photo with data-testid=''photo-dish-tag-{index}''.


    2. **Tagged Photos Display**: On review cards, display dish name overlays on tagged
    photos. Show a small badge with the dish name on the bottom of each tagged photo
    with data-testid=''review-photo-dish-badge''. The badge should be visible on hover
    or always visible depending on space. Untagged photos display normally without
    badges.


    **Routes**: Write review page `/addreview/[restaurantId]`, restaurant details
    `/restaurants/[id]`


    **Element Selectors**:
    - Photo dish selector 0: `[data-testid="photo-dish-selector-0"]`
    - Photo dish selector 1: `[data-testid="photo-dish-selector-1"]`
    - Photo tag button 0: `[data-testid="photo-tag-button-0"]`
    - Photo tag button 1: `[data-testid="photo-tag-button-1"]`'
hint: '**Files**: ~4 files (attach-photos component, review card component, review
  types, photo display)


  **Authentication**: Required for writing reviews'
