problem_id: 0040-review-writing-tone-suggestions
app: deld
task:
  prompt: 'Implement Review Writing Tone Suggestions for the Deld restaurant reviews
    app. Add inline suggestions in the review text area that appear when the user
    types negative language, offering constructive alternatives.


    **Feature Requirements**:


    1. **Tone Suggestion Popover**: Create a Radix Popover component that anchors
    near the textarea. When user types text matching negative patterns (defined in
    config), show popover with the matched phrase highlighted in red with strikethrough
    styling (data-testid="tone-negative-highlight") and the constructive alternative
    highlighted in green (data-testid="tone-positive-highlight").
    Add "Apply Suggestion" button with data-testid="apply-suggestion-button" and "Dismiss"
    button with data-testid="dismiss-suggestion-button". Popover container uses data-testid="tone-suggestion-popover".


    2. **Suggestion Config & Detection**: Create a local config file at src/config/tone-suggestions.ts
    with an array of suggestion rules. Each rule has: pattern (regex string), matchText
    (phrase to detect like "terrible" or "worst ever"), and suggestion (constructive
    alternative text). Detect matches on textarea onChange using these patterns. Show
    only first match found. When "Apply Suggestion" clicked, replace matched text
    in textarea with suggestion text.


    **Routes**: No new routes (extends existing /addreview/[restaurantId] and /editreview/[reviewId]
    pages)


    **Element Selectors**:
    - Post review button: `[data-testid="post-review-button"]`
    - Rating star 3: `[data-testid="rating-star-3"]`
    - Negative highlight (strikethrough): `[data-testid="tone-negative-highlight"]`
    - Positive highlight (suggestion): `[data-testid="tone-positive-highlight"]`'
hint: '**Files**: ~4 files (tone-suggestions.ts config, popover atom component, modified
  about-experience.tsx, package.json for @radix-ui/react-popover)


  **Authentication**: Required (review pages are auth-protected)'
