- name: vlm
  args:
    score_name: screenshot_9_rate_the_tone
    screenshot_url: http://localhost:3000/addreview/
    evaluation_rubric: 'Rate the tone suggestion popover appearance on a scale of
      0 to 1:


      0 - Popover not visible OR missing required elements: No popover appears near
      the textarea after typing negative text, OR the popover is missing the highlighted
      phrase "terrible", OR the "Apply Suggestion" button is not visible, OR the "Dismiss"
      button is not visible, OR the constructive alternative suggestion text is not
      displayed.


      1 - Popover fully functional: The tone suggestion popover with data-testid="tone-suggestion-popover"
      is visible and anchored near the textarea. The matched phrase "terrible" is
      displayed with a highlighted style (distinct color, background, or formatting).
      A constructive alternative suggestion text is shown below the matched phrase.
      Both the "Apply Suggestion" button with data-testid="apply-suggestion-button"
      and the "Dismiss" button with data-testid="dismiss-suggestion-button" are clearly
      visible and actionable.'
