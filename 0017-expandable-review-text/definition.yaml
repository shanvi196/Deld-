- name: vlm
  args:
    score_name: screenshot_9_rate_the_truncated
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the truncated reviews display on a scale of 0 to 1:


      0 - Reviews not truncated correctly: Long reviews display full text without truncation, no ''Read more'' link buttons
      visible, reviews have no ellipsis or line-clamp styling, or the reviews section failed to load


      1 - Reviews truncated correctly: Long reviews (>300 characters) are visually truncated showing approximately 4 lines
      of text, ''Read more'' link appears in blue text below truncated review content, truncated text ends with ellipsis or
      is cut off with CSS line-clamp, review cards have consistent height when truncated'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - '(function() { const reviewsSection = document.querySelector(''[data-testid="recommended-reviews-section"]''); if (reviewsSection)
      reviewsSection.scrollIntoView({ behavior: ''instant'', block: ''center'' }); })()'
- name: vlm
  args:
    score_name: screenshot_10_rate_the_expanded
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the expanded review display on a scale of 0 to 1:


      0 - Review not expanded correctly: Review text still truncated after clicking Read more, no ''Show less'' button visible,
      review card height unchanged from truncated state, or the expand interaction failed


      1 - Review expanded correctly: Full review text is visible without truncation or line-clamp, ''Show less'' link button
      appears in blue text at the end of the expanded review, expanded review card is visibly taller than other truncated
      review cards, transition appears smooth'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - '(function() { const reviewsSection = document.querySelector(''[data-testid="recommended-reviews-section"]''); if (reviewsSection)
      reviewsSection.scrollIntoView({ behavior: ''instant'', block: ''center'' }); })()'
    - await new Promise(resolve => setTimeout(resolve, 500))
    - (function() { const readMoreBtn = document.querySelector('[data-testid="review-read-more"]'); if (readMoreBtn) readMoreBtn.click();
      })()
    - await new Promise(resolve => setTimeout(resolve, 500))
