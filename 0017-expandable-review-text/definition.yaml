problem_id: 0017-expandable-review-text
app: deld
task:
  prompt: 'Implement expandable review text for the Deld restaurant reviews app. Long reviews (>300 characters) should be
    truncated with ellipsis and show a ''Read more'' button. When expanded, show full text with ''Show less'' button.


    **Feature Requirements**:


    1. **Review Text Truncation**: Modify the ReviewText component to truncate reviews exceeding 300 characters. Display truncated
    text with ''...'' ellipsis using CSS line-clamp-4. Add ''Read more'' link button (data-testid=''review-read-more'') below
    truncated text. Only show truncation UI for reviews >300 chars.


    2. **Expand/Collapse Toggle**: Track expanded state per review using React useState. When expanded, show full review text
    without line-clamp. Display ''Show less'' link button (data-testid=''review-show-less'') when expanded. Animate height
    transition using CSS transition-all duration-300.


    **Routes**: /restaurants/[id] (restaurant details page with reviews)'
hint: '**Files**: ~3 (review-text.tsx component, globals.css for transitions, types if needed)


  **Authentication**: Not required - reviews are publicly visible

  **Preferred Account**: If login is required, please use the following credentials: - Login: sarah.chen@email.com - Password:
  password123'
