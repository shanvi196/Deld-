problem_id: 0014-review-helpfulness-acknowledgment
app: deld
task:
  prompt: 'Implement Review Helpfulness Acknowledgment for the Deld restaurant reviews
    app. Users want to mark reviews as helpful and track their votes.


    **Feature Requirements**:


    1. **Helpful Vote Button**: Add a ''Helpful'' button (data-testid=''review-helpful-button'')
    below each review in ReviewCard. When clicked: show toast ''Thanks for the feedback!''
    (data-testid=''helpful-toast''), store the review ID in localStorage key ''deld-helpful-votes''
    as JSON array, and disable the button showing ''You found this helpful'' text
    (data-testid=''review-helpful-voted''). Button should check localStorage on mount
    to show voted state for previously voted reviews. Each review card must have data-testid=''review-card''
    and data-review-id attribute with the review''s ID.


    2. **Hide Voted Reviews Filter**: Add checkbox filter (data-testid=''hide-helpful-filter'')
    in the reviews section header (data-testid=''recommended-reviews-section'') that
    says ''Hide reviews I found helpful''. When checked, filter out reviews whose
    IDs are in the ''deld-helpful-votes'' localStorage array. Filter state should
    be local (not URL-persisted). When all reviews are hidden, show empty state message
    (data-testid=''no-reviews-message'') with text ''No reviews to display''.


    **Routes**: Restaurant detail page /restaurants/[id]'
hint: '**Files**: ~4 (ReviewCard component, reviews list section, localStorage utility,
  filter component)


  **Authentication**: Not required - localStorage tracks votes anonymously

    **Preferred Account**: If login is required, please use the following credentials:
    - Login: sarah.chen@email.com
    - Password: password123


    **localStorage** use following keys in localStorage:

    - `deld-helpful-votes`'
