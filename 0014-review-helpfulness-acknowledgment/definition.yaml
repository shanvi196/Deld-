- name: vlm
  args:
    score_name: screenshot_9_rate_the_helpful
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the helpful button states display on a scale of 0 to
      1:


      0 - Incorrect display: No helpful buttons visible on review cards, OR all buttons
      show the same state (all ''Helpful'' or all ''You found this helpful''), OR
      buttons missing entirely from review cards, OR no visual distinction between
      voted and non-voted states.


      1 - Correct display: At least one review card shows a grayed-out/disabled button
      with text ''You found this helpful'' (voted state), AND at least one other review
      card shows an active ''Helpful'' button (non-voted state), AND a checkbox labeled
      ''Hide reviews I found helpful'' is visible above/near the reviews section.'
    scale:
    - 0
    - 1
    prep_script:
    - window.location.href = "http://localhost:3000"
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - (function () { const restaurants = document.querySelectorAll('[data-testid^="restaurant-card-link-"]');
      if (restaurants.length > 0) { const randomIndex = Math.floor(Math.random() * restaurants.length);
        restaurants[randomIndex].click(); } })()
    - await new Promise(resolve => setTimeout(resolve, 2500))
    - (function() { const firstReviewCard = document.querySelector('[data-testid="review-card"]');
      if (firstReviewCard) { const reviewId = firstReviewCard.getAttribute('data-review-id')
      || 'review-001'; localStorage.setItem('deld-helpful-votes', JSON.stringify([reviewId]));
      } })()
    - window.location.reload()
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - '(function() { const reviewsSection = document.querySelector(''[data-testid="recommended-reviews-section"]'');
      if (reviewsSection) { reviewsSection.scrollIntoView({ behavior: ''instant'',
      block: ''start'' }); } })()'
    - await new Promise(resolve => setTimeout(resolve, 500))
- name: vlm
  args:
    score_name: screenshot_10_rate_the_empty
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the empty reviews state with filter applied on a scale
      of 0 to 1:


      0 - Incorrect display: Review cards are still visible after filter is checked,
      OR no empty state message shown, OR filter checkbox not visible or not checked,
      OR page shows error state instead of graceful empty state.


      1 - Correct display: No review cards are visible in the reviews section, AND
      a centered message ''No reviews to display'' (or similar empty state text) is
      shown, AND the filter checkbox with label ''Hide reviews I found helpful'' appears
      checked, AND the page layout remains intact without breaking.'
    scale:
    - 0
    - 1
    prep_script:
    - window.location.href = "http://localhost:3000"
    - await new Promise(resolve => setTimeout(resolve, 3000))
    - (function () { const restaurants = document.querySelectorAll('[data-testid^="restaurant-card-link-"]');
      if (restaurants.length > 0) { const randomIndex = Math.floor(Math.random() * restaurants.length);
        restaurants[randomIndex].click(); } })()
    - await new Promise(resolve => setTimeout(resolve, 4000))
    - (function() { const reviewCards = document.querySelectorAll('[data-testid="review-card"]');
      const reviewIds = []; reviewCards.forEach(function(card) { const id = card.getAttribute('data-review-id');
      if (id) reviewIds.push(id); }); if (reviewIds.length > 0) { localStorage.setItem('deld-helpful-votes',
      JSON.stringify(reviewIds)); } })()
    - window.location.reload()
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - (function() { const checkbox = document.querySelector('[data-testid="hide-helpful-filter"]');
      if (checkbox && !checkbox.checked) { checkbox.click(); } })()
    - await new Promise(resolve => setTimeout(resolve, 1000))
    - '(function() { const reviewsSection = document.querySelector(''[data-testid="recommended-reviews-section"]'');
      if (reviewsSection) { reviewsSection.scrollIntoView({ behavior: ''instant'',
      block: ''start'' }); } })()'
    - await new Promise(resolve => setTimeout(resolve, 500))
