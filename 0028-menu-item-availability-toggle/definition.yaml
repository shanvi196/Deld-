checklist_items:
- The restaurant detail page displays a 'Menu Items' section below the menu photos
  carousel, showing each menu item as a card with its name, price formatted as $X.XX,
  description (truncated at 80 characters with ellipsis if longer), category label,
  and a color-coded availability badge (green for Available, yellow for Limited, red
  for Sold Out), with all items defaulting to Available status.
- Menu item cards are sorted by status priority (Available first, then Limited, then
  Sold Out), with items within each status group sorted alphabetically by name, and
  this sort order updates immediately whenever any item's status is changed.
- A filter bar with four chips (All, Available, Limited, Sold Out) appears above the
  menu cards, each status chip showing a live count of items in that status; clicking
  a chip filters the visible cards to only that status, and selecting a filter with
  zero matching items shows an appropriate empty state message.
- Authenticated users see a dropdown on each menu item card that allows changing its
  status to Available, Limited, or Sold Out; selecting a new status immediately updates
  the card's badge, the sort order, all filter chip counts, and the sold-out counter
  in the section header — and if a filter is active, items that no longer match are
  removed from view.
- Unauthenticated users see the full Menu Items section with badges and filter bar
  in read-only mode, with no status-change dropdowns rendered and no Reset All button
  visible anywhere on the page.
- Status changes are stored per user in localStorage and persist across page navigation
  — navigating away to the home page and returning to the same restaurant retains
  all previously set statuses, and logging in as a different user shows that user's
  independent status selections.
- A 'Reset All' button appears in the section header only for authenticated users
  when at least one item has been changed from Available; clicking it opens a confirmation
  dialog, and confirming resets all items for that restaurant back to Available, hides
  the sold-out counter badge and the Reset All button, and updates all filter counts
  — while canceling closes the dialog with no changes.
- The section header displays a sold-out counter badge showing the number of sold-out
  items (e.g., '2 Sold Out') that updates in real time as statuses change, and this
  badge is completely hidden when no items are sold out.
