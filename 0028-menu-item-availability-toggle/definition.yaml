problem_id: 0028-menu-item-availability-toggle
app: deld
task:
  prompt: 'Implement Menu Item Availability Tracking for the Deld restaurant detail
    page. Users should see all menu items with availability status badges, filter
    items by status, change statuses (authenticated only), and reset statuses in bulk.
    Status changes must be user-isolated, persist across page navigation, and keep
    all UI surfaces in sync.


    **Feature Requirements**:


    1. **Menu Items Section with Sorted Status Badges**: Add a new "Menu Items" section
    (`data-testid="menu-items-section"`) below the existing Menu photos carousel on
    the restaurant detail page (`/restaurants/[id]`). Display each menu item from
    the restaurant''s `menu` array as a card (`data-testid="menu-item-card-{itemId}"`)
    showing: item name, price formatted as `$X.XX` (e.g., `$9.95`), description truncated
    to 80 characters with `…` appended if longer, a category label, and an availability
    status badge. Status badges: "Available" (green background, `data-testid="status-badge-available"`),
    "Limited" (yellow background, `data-testid="status-badge-limited"`), or "Sold
    Out" (red background, `data-testid="status-badge-sold-out"`). The default status
    for all items is "Available". Items must be **sorted by status priority**: Available
    items first, then Limited, then Sold Out. Within each status group, items are
    sorted **alphabetically by name**. The sort order must update immediately when
    any item''s status changes. When the restaurant has no menu items, show "No menu
    items available" (`data-testid="menu-items-empty"`). The section header displays
    the text "Menu Items" and a sold-out counter badge (`data-testid="sold-out-count-badge"`)
    showing "{N} Sold Out" when N > 0. This badge must be hidden when no items are
    sold out (N === 0).


    2. **Status Filter Bar with Counts**: Add a filter bar (`data-testid="status-filter-bar"`)
    directly above the menu item cards inside the Menu Items section. The bar contains
    four filter chips: "All" (`data-testid="filter-chip-all"`), "Available ({N})"
    (`data-testid="filter-chip-available"`), "Limited ({N})" (`data-testid="filter-chip-limited"`),
    "Sold Out ({N})" (`data-testid="filter-chip-sold-out"`), where {N} is the count
    of items in that status. The "All" chip does not display a count. "All" is selected
    by default. Only one chip can be active at a time; the active chip must have visually
    distinct styling (e.g., filled/solid background vs outline for inactive). Clicking
    a chip immediately filters the displayed cards to only show items matching that
    status. The counts on each chip must update in real time when item statuses change.
    When the active filter matches zero items, display "No items match the selected
    filter" (`data-testid="filter-empty-state"`) in place of the cards grid.


    3. **Availability Status Dropdown (Auth-Gated, User-Isolated)**: Authenticated
    users see a dropdown trigger button (`data-testid="status-dropdown-trigger-{itemId}"`)
    on each menu item card. Clicking the trigger opens a dropdown menu with three
    options: "Available" (`data-testid="status-option-available"`), "Limited" (`data-testid="status-option-limited"`),
    "Sold Out" (`data-testid="status-option-sold-out"`). Selecting an option immediately:
    (a) updates the status badge on that card, (b) re-sorts the entire items list
    by the sort rules in Requirement 1, (c) updates all filter chip counts in the
    filter bar, (d) updates the sold-out counter badge in the section header, and
    (e) if a filter is active and the item no longer matches the active filter, removes
    the item from the visible list. **The dropdown trigger must NOT be rendered at
    all for unauthenticated users** — they see the status badge in read-only mode
    with no interactive elements. Status data is stored in localStorage under the
    key `deld-menu-availability-{userId}` (e.g., `deld-menu-availability-user_0001`).
    The stored JSON structure is: `{ "[restaurantId]": { "[itemId]": "available" |
    "limited" | "sold-out" } }`. Items with no entry in localStorage default to `"available"`.
    **Status changes must persist across page navigation** — navigating to the home
    page and back to the same restaurant must retain all status selections.


    4. **Bulk Reset with Confirmation Dialog**: When at least one menu item for the
    current restaurant has a status other than "available" in localStorage, display
    a "Reset All" button (`data-testid="reset-all-button"`) next to the sold-out counter
    badge in the section header. This button is **only visible to authenticated users**
    and **only when modifications exist** for the current restaurant. Clicking "Reset
    All" opens a confirmation dialog (`data-testid="reset-confirm-dialog"`) with the
    message "Reset all menu item statuses to Available?" and two buttons: "Cancel"
    (`data-testid="reset-cancel-button"`) and "Confirm" (`data-testid="reset-confirm-button"`).
    Clicking "Confirm": removes the current restaurant''s key from the localStorage
    object (preserving other restaurants'' data), resets all status badges to "Available",
    re-sorts the list, updates all filter chip counts, hides the sold-out counter
    badge (since N becomes 0), and hides the "Reset All" button. Clicking "Cancel"
    closes the dialog with no side effects.


    **Routes**: `/restaurants/[id]` (existing restaurant detail page)


    **Auth**: Login required for status changes (Requirement 3) and bulk reset (Requirement
    4). Unauthenticated users see the Menu Items section, status badges, and filter
    bar in read-only mode — no dropdown triggers, no Reset All button. Each authenticated
    user has independent status data keyed by their user ID.


    **State**: localStorage key pattern `deld-menu-availability-{userId}`. JSON structure:
    `{ "[restaurantId]": { "[itemId]": "available" | "limited" | "sold-out" } }`.
    Default status is `"available"` (inferred when no localStorage entry exists).
    Data must persist across in-app navigation (e.g., navigating to home page via
    logo click and returning to the restaurant page).'
