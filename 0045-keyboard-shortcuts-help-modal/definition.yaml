- name: vlm
  args:
    score_name: screenshot_9_rate_the_keyboard
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the keyboard shortcuts help dialog on a scale of 0 to 1:


      0 - Dialog not visible: No modal overlay appears after pressing ''?'' key, page shows normal home view without any dialog
      or popup, no semi-transparent backdrop visible


      1 - Dialog correctly displayed: Modal dialog is visible with semi-transparent backdrop dimming the page behind it, dialog
      is centered on viewport (horizontally and vertically), dialog contains a grid/list layout showing exactly 3 keyboard
      shortcuts: ''/'' with ''Focus search'', ''Esc'' with ''Close modals'', and ''j/k'' with ''List navigation'', each shortcut
      key badge has distinct styling (different background color from description text)'
    scale:
    - 0
    - 1
    prep_script:
    - window.location.href = 'http://localhost:3000'
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - '(function() { document.dispatchEvent(new KeyboardEvent(''keydown'', { key: ''?'', shiftKey: true, bubbles: true }));
      })()'
    - await new Promise(resolve => setTimeout(resolve, 1000))
- name: vlm
  args:
    score_name: screenshot_10_rate_the_help
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the help button and shortcuts dialog on a scale of 0 to 1:


      0 - Help button missing or dialog fails to open: No help button visible in the header area, or clicking the help button
      does not open any dialog, or the button exists but has no question mark/help icon


      1 - Help button and dialog work correctly: Help button is visible in the header area displaying a HelpCircle/question
      mark icon, clicking the button opens a centered modal dialog with rounded corners, dialog has a title ''Keyboard Shortcuts''
      displayed prominently at the top in bold text, backdrop behind the dialog is visually dimmed, dialog shows keyboard
      shortcut items in an organized layout'
    scale:
    - 0
    - 1
    prep_script:
    - window.location.href = 'http://localhost:3000'
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - (function() { const helpBtn = document.querySelector('[data-testid="help-button"]'); if (helpBtn) { helpBtn.click();
      } })()
    - await new Promise(resolve => setTimeout(resolve, 1000))
