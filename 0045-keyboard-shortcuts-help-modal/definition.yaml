problem_id: 0045-keyboard-shortcuts-help-modal
app: deld
task:
  prompt: 'Implement a Keyboard Shortcuts Help Modal for the Deld application. Users need a way to discover available keyboard
    shortcuts to navigate the app more efficiently.


    **Feature Requirements**:


    1. **Shortcuts Help Dialog**: Create a modal dialog accessible via the ''?'' key that displays available keyboard shortcuts.
    The dialog uses the existing Dialog atom components with a grid layout showing key combinations and their descriptions.
    Include shortcuts for: ''/'' (focus search), ''Esc'' (close modals), ''j/k'' (list navigation placeholder). Store shortcuts
    in a constants file at src/config/keyboard/shortcuts.ts. Add data-testid=''shortcuts-help-dialog'' to the dialog, data-testid=''shortcut-item''
    to each shortcut row, data-testid=''shortcut-key'' to the key badge.


    2. **Help Button Trigger**: Add a help icon button in the header that opens the shortcuts dialog when clicked. The button
    should display a question mark icon (use HelpCircle from lucide-react). Add data-testid=''help-button'' to the button.
    The dialog can be opened either by clicking this button OR pressing ''?'' key.


    **Routes**: No new routes needed - dialog is global overlay.'
hint: '**Files**: ~4 files (shortcuts-help-dialog component, shortcuts constants, header modification, keyboard hook)


  **Authentication**: Not required - shortcuts help is available to all users.

  **Preferred Account**: If login is required, please use the following credentials: - Login: sarah.chen@email.com - Password:
  password123'
