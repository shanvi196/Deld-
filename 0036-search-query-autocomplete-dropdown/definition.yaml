- name: vlm
  args:
    score_name: screenshot_9_score_0_if
    screenshot_url: http://localhost:3000
    evaluation_rubric: Score 0 if no dropdown visible below search input. Score 1 if dropdown is visible with at least one
      suggestion item containing 'Sushi' text, positioned below the search query input field.
    scale:
    - 0
    - 1
    prep_script:
    - window.location.href = 'http://localhost:3000'
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - '(function() { const searchInput = document.querySelector(''[data-testid="search-query-input"]''); if (searchInput)
      { const nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, ''value'').set;
      nativeInputValueSetter.call(searchInput, ''sushi''); searchInput.dispatchEvent(new Event(''input'', { bubbles: true
      })); } })()'
    - await new Promise(resolve => setTimeout(resolve, 500))
- name: vlm
  args:
    score_name: screenshot_10_score_0_if
    screenshot_url: http://localhost:3000
    evaluation_rubric: Score 0 if dropdown still visible or input doesn't show 'Breakfast'. Score 1 if dropdown is closed
      (not visible) and search input field contains the text 'Breakfast'.
    scale:
    - 0
    - 1
    prep_script:
    - window.location.href = 'http://localhost:3000'
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - '(function() { const searchInput = document.querySelector(''[data-testid="search-query-input"]''); if (searchInput)
      { const nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, ''value'').set;
      nativeInputValueSetter.call(searchInput, ''break''); searchInput.dispatchEvent(new Event(''input'', { bubbles: true
      })); } })()'
    - await new Promise(resolve => setTimeout(resolve, 500))
    - '(function() { const firstItem = document.querySelector(''[data-testid="autocomplete-item-0"]''); if (firstItem) {[''mousedown'',
      ''mouseup'', ''click''].forEach(eventType => { const event = new MouseEvent(eventType, { bubbles: true, cancelable:
      true, view: window });firstItem.dispatchEvent(event);});}})();'
    - await new Promise(resolve => setTimeout(resolve, 300))
