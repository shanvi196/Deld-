problem_id: 0036-search-query-autocomplete-dropdown
app: deld
task:
  prompt: 'Implement search query autocomplete dropdown for the Deld Restaurant Reviews app. Users need suggestions as they
    type in the search input to quickly find popular search terms.


    **Feature Requirements**:


    1. **Autocomplete Dropdown**: Show dropdown below search-query-input with data-testid=''search-autocomplete-dropdown''
    when user types. Filter hardcoded suggestions [''Pizza'', ''Sushi'', ''Breakfast'', ''Tacos'', ''Italian'', ''Chinese'',
    ''Burgers'', ''Thai''] by input value (case-insensitive). Each suggestion item has data-testid=''autocomplete-item-{index}''.
    Dropdown hidden when input is empty or no matches.


    2. **Suggestion Selection**: Clicking suggestion fills search-query-input with selected text and closes dropdown. Pressing
    Escape closes dropdown without selection. Dropdown closes when clicking outside. Selected text triggers existing search
    debounce behavior.


    **Routes**: Homepage at / (existing)


    **Element Selectors**: - Autocomplete item 0: `[data-testid="autocomplete-item-0"]`'
hint: '**Files**: ~3 (search-bar component modifications, autocomplete suggestions utility)


  **Authentication**: Not required

  **Preferred Account**: If login is required, please use the following credentials: - Login: sarah.chen@email.com - Password:
  password123'
