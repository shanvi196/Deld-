problem_id: 0046-collection-export-to-json-download
app: deld
task:
  prompt: 'Implement Collection Export to JSON Download. Users want to export their restaurant collections as JSON files for backup or sharing.


    **Feature Requirements**:


    1. **Export Button**: Add an ''Export'' button (data-testid=''export-collection-button'') to the collection detail page at /user/collections/[id]. Button should appear in the collection info section near the existing action buttons. Use secondary button styling consistent with existing UI.


    2. **JSON Download**: When clicked, generate and download a JSON file named ''{collection-name}.json''. The JSON structure must include: collection name, createdAt date, and restaurants array with objects containing id, name, cuisine (first item only), rating, and address (formatted as ''street, city, state''). Use browser Blob API and programmatic anchor click for download.


    **Routes**: /user/collections/[id] (modify existing)


    **Element Selectors**:

    - Collection tile: `[data-testid^="collection-tile-"]`'
hint: '**Files**: ~3 (collection info component, export utility function, types if needed)


  **Authentication**: Required (collection pages are auth-protected)'
