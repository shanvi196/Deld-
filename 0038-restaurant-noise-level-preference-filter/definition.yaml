problem_id: 0038-restaurant-noise-level-preference-filter
app: deld
task:
  prompt: 'Implement a noise level filter for the restaurant search. Users want to
    filter restaurants by atmosphere/noise level to find places that match their mood
    - whether they prefer a quiet, moderate, or lively environment.


    **Feature Requirements**:


    1. **Noise Level Filter Component**: Add a single-select radio filter in RestaurantsListFilters
    (after Distance filter) with three options: "Quiet" (data-testid="noise-filter-quiet"),
    "Moderate" (data-testid="noise-filter-moderate"), "Lively" (data-testid="noise-filter-lively").
    Use RadioGroup pattern from DistanceFilter. Filter section title: "Noise Level".
    Container data-testid="noise-filter".


    2. **URL State Integration**: Add noise parameter to search params using nuqs.
    Values: "quiet", "moderate", "lively". URL format: ?noise=quiet. Include in clearFilters()
    reset and appliedFilters tracking (type: "noise").


    **Routes**: / (home page with filters)'
hint: '**Files**: ~4 (noise-filter component, search-params, context actions, applied-filters)


  **Authentication**: Not required

    **Preferred Account**: If login is required, please use the following credentials:
    - Login: sarah.chen@email.com
    - Password: password123'
