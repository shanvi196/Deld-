- name: vlm
  args:
    score_name: screenshot_9_rate_the_noise
    screenshot_url: http://localhost:3000/
    evaluation_rubric: 'Rate the noise filter display with Moderate selection on a
      scale of 0 to 1:


      0 - Filter not properly implemented: Noise filter section is not visible, or
      the Moderate option is not visually highlighted as selected, or the filter section
      is not positioned after the Distance filter, or no restaurant cards are displayed
      in the results area.


      1 - Filter correctly implemented: Noise filter section is visible with title
      "Noise Level", positioned after the Distance filter. The "Moderate" radio option
      is clearly highlighted/selected (visually distinct from unselected options).
      Restaurant cards are visible in the results area showing filtered results.'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - (function() { const radio = document.querySelector('[data-testid="noise-filter-moderate"]');
      if (radio) radio.click(); })()
    - await new Promise(resolve => setTimeout(resolve, 1500))
- name: vlm
  args:
    score_name: screenshot_10_rate_the_noise
    screenshot_url: http://localhost:3000/
    evaluation_rubric: 'Rate the noise filter default state display on a scale of
      0 to 1:


      0 - Filter not properly implemented: Noise filter section is not visible, or
      does not have "Noise Level" as the section title, or does not display all three
      radio options (Quiet, Moderate, Lively), or one or more options appear to be
      pre-selected.


      1 - Filter correctly implemented: Noise filter section is visible with title
      "Noise Level". All three radio options are displayed: "Quiet", "Moderate", and
      "Lively". No option is selected by default (all radio buttons appear in their
      unselected/unchecked state).'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 2000))
