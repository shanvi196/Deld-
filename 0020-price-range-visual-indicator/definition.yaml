- name: vlm
  args:
    score_name: screenshot_9_rate_the_pricescale
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the PriceScale visual indicator display on restaurant
      cards on a scale of 0 to 1:


      0 - PriceScale not implemented correctly: No visual price scale visible on restaurant
      cards, OR price is still displayed as text dollar signs ($, $$, etc.), OR missing
      data-testid="price-scale" containers, OR fewer than 4 indicator elements per
      card, OR indicators are not distinguishable as filled vs empty


      1 - PriceScale correctly implemented: Each restaurant card displays a visual
      price scale with exactly 4 dollar sign indicators, filled indicators use a solid/highlighted
      style that is visually distinct from empty indicators (different color, opacity,
      or weight), the price scale is horizontally aligned within the restaurant card
      metadata section, at least 3 restaurant cards are visible with properly rendered
      price scales showing different fill levels'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 3000))
