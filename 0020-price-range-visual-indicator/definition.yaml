problem_id: 0020-price-range-visual-indicator
app: deld
task:
  prompt: 'Implement a PriceScale visual indicator component for the Deld app. Replace
    text-based price indicators (''$'', ''$$'', etc.) with a visual scale showing
    filled and unfilled dollar signs.


    **Feature Requirements**:


    1. **PriceScale Atom Component**: Create a reusable `PriceScale` atom in `src/components/atoms/price-scale/price-scale.tsx`.
    Display 4 dollar signs where filled signs represent the price level and unfilled
    signs show remaining scale. Props: `level: 1|2|3|4`. Use `data-testid="price-scale"`
    for container, `data-testid="price-scale-filled"` for filled indicators, `data-testid="price-scale-empty"`
    for empty indicators.


    2. **Tooltip with Price Range**: Add hover tooltip showing dollar range per person.
    Level 1: "Under $15", Level 2: "$15-$30", Level 3: "$30-$60", Level 4: "Over $60".
    Use `data-testid="price-scale-tooltip"` for tooltip content. Integrate into RestaurantCard
    molecule replacing current text price display.


    **Routes**: No new routes

    **Auth**: Not required'
hint: '**Files**: ~4 (price-scale atom, tooltip integration, restaurant-card update,
  types)

    **Preferred Account**: If login is required, please use the following credentials:
    - Login: sarah.chen@email.com
    - Password: password123'
