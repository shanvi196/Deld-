problem_id: 0026-review-character-limit-warning
app: deld
task:
  prompt: 'Implement a character limit warning system for the review form. The existing
    character counter in the CharacterCountIndicator component needs color-based visual
    feedback as users approach the 1000 character limit.


    **Feature Requirements**:


    1. **Color-Coded Counter Display**: Modify the CharacterCountIndicator component
    to show the counter text in different colors based on character count thresholds.
    Display text in green (text-green-600) when under 800 characters, yellow (text-yellow-600)
    when between 800-960 characters, and red (text-red-600) when at 960+ characters.
    Add data-testid="character-count-text" to the counter text element.


    2. **Warning Message at High Count**: When character count exceeds 960 characters,
    display an additional warning message "Approaching character limit!" below the
    counter. This warning should have data-testid="character-limit-warning" and use
    text-red-600 styling. The warning should only appear when count >= 960 and disappear
    when count drops below 960.


    **Routes**: /addreview/[restaurantId] (existing)'
hint: '**Files**: ~2 files (character-count-indicator.tsx, about-experience.tsx)


  **Authentication**: Required (must be logged in to access review form)'
