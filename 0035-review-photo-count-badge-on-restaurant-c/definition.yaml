problem_id: 0035-review-photo-count-badge-on-restaurant-c
app: deld
task:
  prompt: 'Implement a photo count badge overlay on restaurant card images. When a
    restaurant has more than 1 photo in its photos.general array, display a small
    badge in the bottom-right corner of the card image showing the total photo count
    (e.g., ''12 photos'').


    **Feature Requirements**:


    1. **Photo Count Badge Display**: Add a badge overlay positioned at the bottom-right
    corner of the restaurant card image (data-testid=''photo-count-badge''). The badge
    should have a semi-transparent dark background (bg-black/60) with white text.
    Format: ''{count} photos'' (e.g., ''5 photos''). Only render the badge when the
    restaurant has more than 1 photo in photos.general array.


    2. **Conditional Rendering Logic**: The badge must only appear when photos.general.length
    > 1. If photos is null, undefined, or photos.general has 0 or 1 items, no badge
    should be displayed. The badge should be positioned using absolute positioning
    within the existing relative image container.


    **Routes**: Home page (/) displays restaurant cards'
hint: '**Files**: ~2 (restaurant-card.tsx component modification, possibly a new photo-count-badge
  atom)


  **Authentication**: Not required

    **Preferred Account**: If login is required, please use the following credentials:
    - Login: sarah.chen@email.com
    - Password: password123'
