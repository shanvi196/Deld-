- name: vlm
  args:
    score_name: screenshot_9_rate_the_photo
    screenshot_url: http://localhost:3000/
    evaluation_rubric: 'Rate the photo count badge implementation on restaurant cards
      on a scale of 0 to 1:


      0 - Badge implementation missing or incorrect: No photo count badges visible
      on any restaurant cards, or badges appear on cards that should not have them
      (single photo or no photos), or badges are not positioned in the bottom-right
      corner of card images, or badge text format is incorrect (not showing ''{number}
      photos'' pattern), or badge styling is wrong (missing dark semi-transparent
      background or white text).


      1 - Badge implementation correct: Restaurant cards with more than 1 photo display
      photo count badges in the bottom-right corner of their card images. Badges have
      dark semi-transparent backgrounds (bg-black/60 class visible as darkened overlay).
      Badge text is white and formatted as ''{number} photos'' where number matches
      the actual photo count. At least 2-3 restaurant cards with badges are visible
      on the home page. Badges are properly positioned using absolute positioning
      within the image container.'
    scale:
    - 0
    - 1
    prep_script:
    - window.location.href = 'http://localhost:3000';
    - await new Promise(resolve => setTimeout(resolve, 2500))
    - (function() { const cards = document.querySelectorAll('[data-testid^="restaurant-card-link-"]');
      if (cards.length < 3) { window.scrollTo(0, 500); } })()
    - await new Promise(resolve => setTimeout(resolve, 1000))
- name: vlm
  args:
    score_name: screenshot_10_rate_the_visual
    screenshot_url: http://localhost:3000/
    evaluation_rubric: 'Rate the visual consistency of photo count badge positioning
      and styling on a scale of 0 to 1:


      0 - Inconsistent badge styling or positioning: Photo count badges have inconsistent
      positioning across different restaurant cards (not uniformly in bottom-right
      corners), or badge sizes vary inconsistently between cards, or font styling
      differs between badges, or some badges have different background opacity levels,
      or badges are not aligned consistently with 8px margins from bottom and right
      edges.


      1 - Consistent badge styling and positioning: All visible photo count badges
      are consistently positioned in the bottom-right corners of their respective
      card images. All badges have identical styling including: same dark semi-transparent
      background color, same white text color, same font size and padding, same border-radius.
      Badges maintain sufficient contrast (white text readable against dark background).
      Multiple cards with badges visible show uniform appearance and positioning.'
    scale:
    - 0
    - 1
    prep_script:
    - window.location.href = 'http://localhost:3000';
    - await new Promise(resolve => setTimeout(resolve, 2500))
    - window.scrollTo(0, 600)
    - await new Promise(resolve => setTimeout(resolve, 1500))
