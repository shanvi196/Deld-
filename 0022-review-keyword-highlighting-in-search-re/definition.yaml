- name: vlm
  args:
    score_name: screenshot_9_rate_the_review
    screenshot_url: http://localhost:3000/
    evaluation_rubric: 'Rate the review snippet with highlighted keywords display
      on a scale of 0 to 1:


      0 - Feature not implemented: No review snippets visible on restaurant cards,
      OR no yellow highlighting visible despite search query ''food'' being entered,
      OR restaurant cards missing entirely, OR page shows error state


      1 - Feature correctly implemented: Restaurant cards display review snippets
      below restaurant names, keywords matching ''food'' are highlighted with yellow
      background (bg-yellow-200), review text is readable and properly truncated if
      needed, multiple restaurant cards visible with consistent snippet formatting'
    scale:
    - 0
    - 1
    prep_script:
    - window.location.href = 'http://localhost:3000/'
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - '(function() { const input = document.querySelector(''[data-testid="search-query-input"]'');
      if (input) { Object.getOwnPropertyDescriptor( window.HTMLInputElement.prototype,
      ''value'' ).set.call(input, ''food''); input.dispatchEvent(new Event(''input'',
      { bubbles: true })); } })()'
    - await new Promise(resolve => setTimeout(resolve, 1500))
