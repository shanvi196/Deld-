problem_id: 0022-review-keyword-highlighting-in-search-re
app: deld
task:
  prompt: 'Implement review keyword highlighting in search results for the Deld restaurant
    app. When users search for restaurants, restaurant cards should display a review
    snippet (first 100 characters of the most recent review), and matching search
    keywords should be highlighted with a yellow background.


    **Feature Requirements**:


    1. **Review Snippet Display**: Add a review snippet to each restaurant card showing
    the first 100 characters of the restaurant''s most recent review (by date). Display
    below the restaurant name with data-testid=''review-snippet''. If no reviews exist,
    show nothing. Truncate with ellipsis if longer than 100 chars.


    2. **Keyword Highlighting**: When a search query exists (from URL param or search
    input), highlight matching keywords in the review snippet with a yellow background
    (bg-yellow-200). Use a utility function to wrap matches in <mark> elements with
    data-testid=''highlighted-keyword''. Case-insensitive matching.


    **Routes**: Homepage at `/` displays restaurant cards with search functionality.'
hint: '**Files**: ~4 files (restaurant-card component, highlight utility, API query
  update, types)


  **Authentication**: Not required - search and display work for all users.

    **Preferred Account**: If login is required, please use the following credentials:
    - Login: sarah.chen@email.com
    - Password: password123'
