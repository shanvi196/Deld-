problem_id: 0015-custom-sort-preferences-memory
app: deld
task:
  prompt: 'Implement sort preference memory for the home page restaurant search. When
    users change the sort option, save their preference to localStorage under ''deld-sort-memory''
    with key ''home'' and show a toast ''Sort preference saved''. When returning to
    the home page, auto-apply the saved sort preference. Add a ''Reset to Default''
    option in the sort dropdown that clears the saved preference, resets to ''Recommended'',
    and shows toast ''Sort reset to default''.


    **Feature Requirements**:


    1. **Sort Preference Persistence**: Save user''s selected sort option to localStorage
    when changed. Key: ''deld-sort-memory'', structure: {home: ''highest-rated''}.
    On home page load, read localStorage and apply saved sort if exists. Show toast
    ''Sort preference saved'' on each sort change with data-testid=''sort-saved-toast''.


    2. **Reset to Default Option**: Add ''Reset to Default'' item at bottom of sort
    dropdown with data-testid=''sort-reset-to-default''. When clicked: clear localStorage
    preference, set sort to ''Recommended'', show toast ''Sort reset to default''
    with data-testid=''sort-reset-toast''. Item should have separator above it.


    **Routes**: Home page http://localhost:3000


    **Element Selectors**:
    - Sort option newest: `[data-testid="sort-option-newest"]`
    - Sort option highest rated: `[data-testid="sort-option-highest-rated"]`'
hint: '**Files**: ~3-4 files (restaurant-list-header.tsx, localStorage utility, RestaurantsSearchContext
  or hook)


  **Authentication**: Not required

    **Preferred Account**: If login is required, please use the following credentials:
    - Login: sarah.chen@email.com
    - Password: password123


    **localStorage** use following keys in localStorage:

    - `home`'
