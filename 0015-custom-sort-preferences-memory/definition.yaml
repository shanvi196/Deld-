- name: vlm
  args:
    score_name: screenshot_9_rate_the_sort
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the sort dropdown display on a scale of 0 to 1:


      0 - Dropdown not properly displayed: Sort dropdown is not open, options are
      not visible, or ''Reset to Default'' option is missing. Separator line between
      sort options and ''Reset to Default'' is not present.


      1 - Dropdown correctly displayed: Sort dropdown is open showing all sort options
      in order (Recommended, Highest Rated, Most Reviewed, Newest). A visual separator
      line appears between ''Newest'' and ''Reset to Default''. ''Reset to Default''
      is the last item positioned below the separator.'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - '(function(){const el=document.querySelector(''[data-testid="sort-dropdown-trigger"]'');if(el)el.dispatchEvent(new KeyboardEvent(''keydown'',{key:''Enter'',bubbles:true}));})();'
    - await new Promise(resolve => setTimeout(resolve, 500))
- name: vlm
  args:
    score_name: screenshot_10_rate_the_toast
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the toast notification display on a scale of 0 to 1:


      0 - Toast not visible or incorrect: No toast notification appears after sort
      change, or toast does not display ''Sort preference saved'' text, or toast is
      not positioned at bottom-center of screen.


      1 - Toast correctly displayed: A toast notification is visible at bottom-center
      of the screen displaying the text ''Sort preference saved''. The toast should
      be clearly visible and properly styled.'
    scale:
    - 0
    - 1
    prep_script:
    - window.localStorage.removeItem('deld-sort-memory')
    - window.location.href = 'http://localhost:3000'
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - '(function(){const el=document.querySelector(''[data-testid="sort-dropdown-trigger"]'');if(el)el.dispatchEvent(new KeyboardEvent(''keydown'',{key:''Enter'',bubbles:true}));})();'
    - await new Promise(resolve => setTimeout(resolve, 500))
    - (function waitForOption(){const option=document.querySelector('[data-testid="sort-option-highest-rated"]');
      if(!option){requestAnimationFrame(waitForOption);return;}
      option.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));option.click();})();
    - await new Promise(resolve => setTimeout(resolve, 500))
