problem_id: 0027-empty-state-illustrations-for-collection
app: deld
task:
  prompt: 'Add friendly empty state illustrations for the Collections feature. When a user has no collections, show an empty state in the collections grid with an inline SVG illustration, descriptive text (''No collections yet''), and a CTA button (''Create your first collection''). When viewing a collection with no restaurants, enhance the existing empty state with an SVG illustration. Both empty states should use the existing Button component.


    **Feature Requirements**:


    1. **Empty Collections Grid**: When user has no collections, display empty state instead of returning null. Show an inline SVG illustration (simple folder/collection icon), heading text ''No collections yet'', description ''Start organizing your favorite restaurants'', and a Button with text ''Create your first collection'' that triggers the create collection dialog. Container uses data-testid=''empty-collections-state'', illustration uses data-testid=''empty-collections-illustration'', button uses data-testid=''create-first-collection-button''.


    2. **Empty Collection Items Illustration**: Enhance the existing empty-collection-items-list.tsx to include an SVG illustration above the text. Add a simple plate/utensils icon SVG with data-testid=''empty-collection-items-illustration''. Keep existing text ''This collection is empty'' and ''Browse Restaurants'' button.


    **Routes**: /user/collections (collections grid), /user/collections/[id] (collection detail)


    **Element Selectors**:
    - Collection tile: `[data-testid="collection-tile"]`
    - Create collection dialog: `[data-testid="create-collection-dialog"]`'
hint: '**Files**: ~2 files (client-side-collections-grid.tsx, empty-collection-items-list.tsx)


  **Authentication**: Required (collections are user-specific)'
