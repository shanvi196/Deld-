- name: vlm
  args:
    score_name: screenshot_9_rate_the_selection
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the selection mode display on a scale of 0 to 1:


      0 - Selection mode not functional: No checkboxes visible next to restaurant
      items, no floating action bar at bottom, or no visual indication of selection
      state.


      1 - Selection mode correctly displayed: Checkboxes visible to the left of each
      restaurant item, exactly 2 items with checked/filled checkboxes, exactly 1 or
      more items with unchecked/empty checkboxes, floating action bar fixed at bottom
      of viewport with semi-transparent or distinct background, ''Remove Selected
      (2)'' button visible in action bar with red/danger styling, ''Cancel'' button
      visible in header area where ''Select'' button was.'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - (function() { const loginBtn = document.querySelector('[data-testid="header-login-button"]');
      if (loginBtn) loginBtn.click(); })()
    - await new Promise(resolve => setTimeout(resolve, 1000))
    - '(function() { const emailInput = document.querySelector(''[data-testid="login-email-input"]'');
      if (emailInput) { Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,
      ''value'').set.call(emailInput, ''sarah.chen@email.com''); emailInput.dispatchEvent(new
      Event(''input'', { bubbles: true })); } })()'
    - '(function() { const passInput = document.querySelector(''[data-testid="login-password-input"]'');
      if (passInput) { Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,
      ''value'').set.call(passInput, ''password123''); passInput.dispatchEvent(new
      Event(''input'', { bubbles: true })); } })()'
    - await new Promise(resolve => setTimeout(resolve, 500))
    - (function() { const submitBtn = document.querySelector('[data-testid="login-submit-button"]');
      if (submitBtn) submitBtn.click(); })()
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - (function() { const avatar = document.querySelector('[data-testid="user-avatar-menu-trigger"]');
      if (avatar) avatar.click(); })()
    - await new Promise(resolve => setTimeout(resolve, 500))
    - (function() { const collectionsLink = document.querySelector('[data-testid="user-avatar-menu-collections"]');
      if (collectionsLink) collectionsLink.click(); })()
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - (function() { const firstCollection = document.querySelector('[data-testid^="collection-tile"]
      a, a[href^="/user/collections/"]'); if (firstCollection) { window.location.href
      = firstCollection.getAttribute('href'); } })()
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - (function() { const selectBtn = document.querySelector('[data-testid="select-mode-toggle"]');
      if (selectBtn) selectBtn.click(); })()
    - await new Promise(resolve => setTimeout(resolve, 1000))
    - (function() { const checkboxes = document.querySelectorAll('[data-testid^="item-checkbox-"]');
      if (checkboxes.length >= 2) { checkboxes[0].click(); checkboxes[1].click();
      } })()
    - await new Promise(resolve => setTimeout(resolve, 1000))
