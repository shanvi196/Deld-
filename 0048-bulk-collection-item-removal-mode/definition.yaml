problem_id: 0048-bulk-collection-item-removal-mode
app: deld
task:
  prompt: 'Implement a bulk selection mode for collection detail pages. When a user
    navigates to `/user/collections/[id]`, they can toggle a ''Select'' mode that
    enables checkboxes next to each restaurant item.


    **Feature Requirements**:


    1. **Selection Mode Toggle**: Add a ''Select'' button (data-testid=''select-mode-toggle'')
    to the collection header area that toggles selection mode on/off. When active,
    show checkboxes (data-testid=''item-checkbox-{restaurantId}'') next to each restaurant
    in the list. Track selected items using React state (Set<string> of restaurantIds).


    2. **Floating Action Bar with Confirmation**: When items are selected, display
    a floating action bar (data-testid=''bulk-action-bar'') at the bottom with a ''Remove
    Selected (N)'' button (data-testid=''remove-selected-button''). Clicking it opens
    a confirmation dialog (data-testid=''bulk-remove-dialog'') showing "Remove N restaurants
    from collection?". Use the existing removeCollectionItemsMutationOptions for the
    API call.


    **Routes**: `/user/collections/[id]` (existing collection detail page)


    **Element Selectors**:
    - Bulk remove confirm: `[data-testid="bulk-remove-confirm"]`'
hint: '**Files**: ~3-4 (client-side-collection-items-list.tsx, new floating-action-bar
  component, new bulk-remove-dialog component)


  **Authentication**: Required (collection pages are auth-protected)'
