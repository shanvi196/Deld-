problem_id: 0021-neighborhood-quick-jump-navigation
app: deld
task:
  prompt: 'Implement a ''Neighborhood Quick Jump'' feature in the search sidebar.
    Users want to quickly discover restaurants by neighborhood without typing in search.


    **Feature Requirements**:


    1. **Neighborhood Section Component**: Add a collapsible ''Explore by Neighborhood''
    section in the search sidebar (below distance filter). Display clickable neighborhood
    names extracted from available restaurants with restaurant count in parentheses
    (e.g., ''Mission District (24)''). Section starts expanded by default. Collapse/expand
    via chevron icon button with data-testid=''neighborhood-section-toggle''. Section
    container has data-testid=''neighborhood-section''. Each neighborhood item has
    data-testid=''neighborhood-item-{name}'' (kebab-case name).


    2. **Neighborhood Filter Action**: Clicking a neighborhood name applies it as
    the location filter (updates URL with location={neighborhood}). Active neighborhood
    is visually highlighted. Clicking same neighborhood again clears the filter. Filter
    integrates with existing RestaurantsSearchContext via setLocation action.


    **Routes**: / (home/search page)


    **Element Selectors**:
    - Neighborhood item: `[data-testid="neighborhood-item-${kebabName}"]`'
hint: '**Files**: ~4 (neighborhood-section component, search context integration,
  sidebar layout update, utility for extracting neighborhoods)


  **Authentication**: Not required

    **Preferred Account**: If login is required, please use the following credentials:
    - Login: sarah.chen@email.com
    - Password: password123'
