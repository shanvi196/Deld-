- name: vlm
  args:
    score_name: screenshot_9_rate_the_neighborhood
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the neighborhood section display on a scale of 0 to 1:


      0 - Neighborhood section missing or broken: No ''Explore by Neighborhood'' section
      visible in sidebar, or section exists but has no neighborhood items, or no counts
      displayed next to neighborhood names, or section is not positioned below existing
      filters in sidebar


      1 - Neighborhood section correctly implemented: ''Explore by Neighborhood''
      heading visible in sidebar below existing filters, at least 5 clickable neighborhood
      names displayed in vertical list format, each neighborhood shows a count in
      parentheses (e.g., ''Mission District (24)''), chevron icon visible for collapse/expand
      functionality'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 2500))
- name: vlm
  args:
    score_name: screenshot_10_rate_the_active
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the active neighborhood state on a scale of 0 to 1:


      0 - No active state visible: Clicked neighborhood has no visual distinction
      from other neighborhoods, or neighborhood items are not clickable, or no change
      in appearance after clicking, or URL does not reflect the filter


      1 - Active neighborhood correctly highlighted: Clicked neighborhood item has
      distinct visual highlight (different background color or border), other neighborhood
      items appear in default/inactive state, restaurant results area shows filtered
      content, URL bar displays ''location='' parameter with neighborhood name'
    scale:
    - 0
    - 1
    prep_script:
    - window.location.href = 'http://localhost:3000';
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - (function() { const item = document.querySelector('[data-testid^="neighborhood-item-"]');
      if (item) { item.click(); } })()
    - await new Promise(resolve => setTimeout(resolve, 1500))
