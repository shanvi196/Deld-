    score_name: screenshot_9_rate_the_suggested
    screenshot_url: http://localhost:3000/user/collections
    evaluation_rubric: 'Rate the suggested collections section layout on a scale of
      0 to 1:


      0 - Missing or broken: No ''Suggested for You'' section visible, or section
      appears below collections grid instead of above, or no suggestion cards displayed,
      or cards lack collection names or Create buttons, or page shows error state


      1 - Correctly implemented: A clearly visible ''Suggested for You'' section appears
      ABOVE the existing collections grid, contains suggestion cards displayed in
      a horizontal row or grid layout, each card prominently shows a collection name
      (like ''5-Star Favorites'' or ''Budget Eats''), each card displays a restaurant
      count (at least 2), each card has a visible ''Create'' button, and the existing
      collections grid appears below the suggestions section'
