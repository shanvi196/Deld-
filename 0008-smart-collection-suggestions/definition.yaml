problem_id: 0008-smart-collection-suggestions
app: deld
task:
  prompt: 'Implement Smart Collection Suggestions for the Deld restaurant app. Add
    a ''Suggested Collections'' section on the /user/collections page that displays
    3-4 auto-generated collection ideas based on the logged-in user''s review history.


    **Feature Requirements**:


    1. **Suggested Collections Section**: Display a section titled "Suggested for
    You" (data-testid="suggested-collections-section") above the existing collections
    grid. Show 3-4 suggestion cards (data-testid="suggestion-card") each with: collection
    name, description, restaurant count, and a "Create" button (data-testid="create-suggestion-button").
    Suggestions are generated client-side by analyzing user''s reviews - filter by:
    5-star ratings for "Your 5-Star Favorites", restaurants with priceRange "$" or
    "$$" for "Budget Eats", reviews with occasion containing "date" for "Date Night
    Spots". Hide section if user has no reviews or no suggestions qualify (minimum
    2 restaurants per suggestion).


    2. **Create Collection from Suggestion**: When user clicks "Create" on a suggestion
    card, create a new collection via existing POST /api/collections endpoint with
    the suggestion name, then add all matching restaurants via POST /api/collections/[id]/items.
    Show loading state on button during creation (data-testid="create-suggestion-loading").
    After success, remove that suggestion card from the list and show toast "Collection
    created!". The new collection appears in the collections grid below.


    **Routes**: /user/collections (modify existing page)

    **Element Selectors**:
    - Suggestion card name: `[data-testid="suggestion-card-name"]`
    - Collection tile: `[data-testid="collection-tile"]`
    - Suggestion card restaurant count: `[data-testid="suggestion-card-restaurant-count"]`'
hint: '**Files**: ~4 (suggested-collections-section component, suggestion-card component,
  collections page, suggestion-generator utility)


  **Authentication**: Required (uses logged-in user''s reviews)'
