problem_id: 0001-implement-restaurant-comparison-tool
app: deld
task:
  prompt: 'Implement a restaurant comparison tool for the Deld platform. Users want
    to compare multiple restaurants side-by-side before making dining decisions. Create
    a comparison feature that allows users to select restaurants, view them in a comparison
    table, and manage selections across multiple pages.


    **Feature Requirements**:


    1. **Comparison Selection on Search Page**: Add a compare toggle button (data-testid:
    "restaurant-card-compare-button-{restaurantId}") to each restaurant card on the
    search/home page. Clicking the button when the user is NOT logged in must open
    the login dialog (do not add to comparison). When logged in, clicking adds the
    restaurant to the user''s comparison list stored in localStorage. The localStorage
    key must be `comparisonList-{userId}` (e.g., `comparisonList-user_0001`) and the
    value must be a JSON array of objects: `[{"restaurantId": "...", "addedAt": "<ISO
    8601 timestamp>"}]`. Maximum 4 restaurants can be in the comparison list at once.
    When the limit is reached and the user tries to add another, show a toast with
    the exact message: "Maximum 4 restaurants can be compared". The compare button
    must show a selected visual state with aria-pressed="true" when the restaurant
    is in the comparison list, and aria-pressed="false" otherwise. Clicking a selected
    button must remove that restaurant from the comparison list (toggle behavior).
    The comparison list must persist in localStorage across page navigations — navigating
    to a restaurant detail page and back must preserve the selected state of all compare
    buttons.


    2. **Floating Comparison Bar**: When at least 1 restaurant is in the comparison
    list, display a fixed floating bar (data-testid: "comparison-bar") anchored to
    the bottom of the viewport on the search page. The bar must show a mini thumbnail
    image (data-testid: "comparison-bar-thumbnail-{restaurantId}") for each selected
    restaurant, ordered left-to-right by addedAt timestamp (earliest first). Each
    thumbnail must have an "x" remove button (data-testid: "comparison-bar-remove-{restaurantId}")
    that removes that restaurant from the comparison list. Removing via the bar must
    immediately update the corresponding restaurant card''s compare button (aria-pressed
    must flip to "false"). The bar must display the count as: "1 restaurant selected"
    (singular) or "N restaurants selected" (plural, for N > 1). Include a "Compare
    Now" button (data-testid: "comparison-bar-compare-button") that navigates to /compare.
    The "Compare Now" button must be disabled (with attribute disabled) when fewer
    than 2 restaurants are selected. The bar must be hidden when 0 restaurants are
    selected.


    3. **Comparison View Page**: Create a "/compare" route displaying a comparison
    table (data-testid: "comparison-table"). The table must show side-by-side columns
    (data-testid: "comparison-column-{restaurantId}") ordered left-to-right by addedAt
    timestamp (earliest added on the left). Each column must display, in order from
    top to bottom: restaurant photo (first general photo or placeholder), restaurant
    name, star rating (rendered as filled/empty stars plus numeric value), price range
    (as $ symbols), cuisine types (as individual pill/chip elements), key features
    section showing delivery, reservations, outdoor seating, wifi, and parking as
    rows with checkmark icons for available and dash for unavailable, and operating
    hours for each day of the week. Each column must include a "Remove" button (data-testid:
    "comparison-column-remove-{restaurantId}") that removes the restaurant from the
    comparison list AND removes the column from the table in real-time. A "Clear All"
    button (data-testid: "comparison-clear-all-button") in the top-right must remove
    all restaurants from the comparison list and show the empty state. The empty state
    must display the text "Select restaurants to compare" and include a link (data-testid:
    "comparison-empty-back-link") that navigates back to the home/search page ("/").
    When the last restaurant is removed via individual remove buttons, the view must
    also transition to the empty state.


    4. **Multi-Surface Indicators**: Add a comparison badge (data-testid: "header-comparison-badge")
    to the site header (next to the user section) that displays the number of restaurants
    in the comparison list. The badge must only be visible when at least 1 restaurant
    is selected and must be clickable, navigating to /compare. On the restaurant detail
    page, add a compare toggle button (data-testid: "detail-compare-button-{restaurantId}")
    in the quick actions area. This button must show "Add to Compare" when the restaurant
    is not in the list (aria-pressed="false") and "In Comparison" when it is (aria-pressed="true").
    Clicking must toggle the restaurant in/out of the comparison list with the same
    max-4 limit and toast behavior. When a restaurant is added or removed from the
    detail page, navigating back to the search page must reflect the updated state
    on all compare buttons and the floating comparison bar. All surfaces (search cards,
    comparison bar, detail page button, header badge, comparison page) must stay in
    sync — a change on any surface must be reflected on all others.


    **Implementation Details**:

    - New Route: /compare (comparison page)

    - Authentication: Required — clicking compare when not logged in opens auth dialog

    - localStorage key: `comparisonList-{userId}` where userId comes from the logged-in
    user''s id (e.g., `comparisonList-user_0001`)

    - localStorage schema: `[{"restaurantId": "dc553a2b-ac48-4126-964b-bd95e45e5670",
    "addedAt": "2024-01-15T10:30:00.000Z"}]`

    - Column ordering: by addedAt ascending (earliest first on the left)

    - Toast message (exact): "Maximum 4 restaurants can be compared"

    - Count format (singular): "1 restaurant selected"

    - Count format (plural): "3 restaurants selected"

    - Empty state message: "Select restaurants to compare"

    - User isolation: Each user has their own comparison list. Logging out and logging
    in as a different user must show that user''s comparison list (or empty if they
    have none). Switching users must not leak comparison data between accounts.'
