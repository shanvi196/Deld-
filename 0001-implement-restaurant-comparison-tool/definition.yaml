checklist_items:
- Each restaurant card on the search page has a compare toggle button that adds the
  restaurant to the comparison list when clicked by a logged-in user, visually indicates
  selected state, and removes the restaurant when clicked again; clicking the button
  while logged out opens the login dialog instead of adding to the list.
- The comparison list is stored per user in localStorage, keyed by user ID, so that
  switching accounts shows each user's own selections without leaking data between
  accounts, and selections persist across page navigations and reloads.
- A maximum of 4 restaurants can be added to the comparison list; attempting to add
  a fifth shows a toast with the message 'Maximum 4 restaurants can be compared' and
  does not add the restaurant.
- A floating bar appears at the bottom of the search page whenever at least one restaurant
  is selected, showing thumbnail images for each selected restaurant in chronological
  order, a count label using correct singular/plural phrasing, individual remove buttons
  per thumbnail, and a 'Compare Now' button that is disabled when fewer than 2 restaurants
  are selected and navigates to the comparison page otherwise.
- The comparison page at /compare displays a side-by-side table with columns ordered
  by selection time, each showing the restaurant's photo, name, star rating, price
  range, cuisine tags, key features (delivery, reservations, outdoor seating, wifi,
  parking) with check/dash indicators, and daily operating hours.
- Removing a restaurant from the comparison page (via individual column remove or
  'Clear All') immediately updates the table, and when all restaurants are removed
  the page shows an empty state with the text 'Select restaurants to compare' and
  a link back to the home page.
- A comparison badge in the site header shows the count of selected restaurants whenever
  at least one is selected and navigates to the comparison page when clicked; the
  restaurant detail page includes a compare toggle button that respects the same max-4
  limit and toast behavior.
- 'All comparison surfaces stay in sync: adding or removing a restaurant from the
  detail page, the floating bar, or the comparison page is immediately reflected on
  every other surface, including the search card toggle states, the floating bar thumbnails
  and count, the header badge count, and the comparison table columns.'
