problem_id: 0023-review-sorting-dropdown
app: deld
task:
  prompt: 'Implement a review sorting dropdown for restaurant detail pages. Users
    want to sort reviews to find the most relevant ones quickly.


    **Feature Requirements**:


    1. **Sort Dropdown Component**: Add a dropdown menu above the reviews section
    on restaurant detail pages using the existing DropdownMenu atom component. The
    dropdown trigger should display the currently selected sort option with data-testid="review-sort-dropdown-trigger".
    Dropdown content should have data-testid="review-sort-dropdown-content". Sort
    options: "Newest First" (data-testid="review-sort-option-newest"), "Oldest First"
    (data-testid="review-sort-option-oldest"), "Highest Rated" (data-testid="review-sort-option-highest"),
    "Lowest Rated" (data-testid="review-sort-option-lowest"), "Most Helpful" (data-testid="review-sort-option-helpful").


    2. **URL State Persistence**: Store the selected sort option in URL search params
    using nuqs for shareability. Parameter name: "reviewSort" with values: "newest",
    "oldest", "highest", "lowest", "helpful". Default sort is "newest". When user
    selects a sort option, update URL param and re-sort the displayed reviews accordingly.
    The sort should persist across page navigation and page refresh. Each review card
    must include data-rating attribute with the numeric rating value (1-5) for testing
    sort order.


    **Routes**: `/restaurants/[id]` (restaurant detail page)'
hint: '**Files**: ~4 (review-sort-dropdown component, reviews section integration,
  nuqs parser setup, client-side sorting logic)


  **Authentication**: Not required (public feature)

    **Preferred Account**: If login is required, please use the following credentials:
    - Login: sarah.chen@email.com
    - Password: password123'
