- name: vlm
  args:
    score_name: screenshot_9_rate_the_review
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the review sort dropdown display on a scale of 0 to 1:


      0 - No dropdown visible: Review sort dropdown is not present on the restaurant
      detail page, or the dropdown trigger is not clickable, or clicking reveals no
      dropdown content.


      1 - Dropdown correctly displayed: Review sort dropdown is visible and open,
      showing all five sort options (Newest First, Oldest First, Highest Rated, Lowest
      Rated, Most Helpful) with proper styling consistent with the app''s existing
      DropdownMenu design patterns. Options should be clearly readable and appear
      in a dropdown menu format.'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 3000));
    - |
      document.querySelector('[data-testid="review-sort-dropdown-trigger"]').scrollIntoView({ behavior: 'smooth', block: 'center'});
    - await new Promise(resolve => setTimeout(resolve, 1000));
    - |
      document.querySelector('[data-testid="review-sort-dropdown-trigger"]').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    - await new Promise(resolve => setTimeout(resolve, 500));
- name: vlm
  args:
    score_name: screenshot_10_rate_the_sorted
    screenshot_url: http://localhost:3000/restaurants/25047088-5a40-4fab-be5c-3ee9a54fb980?reviewSort=highest
    evaluation_rubric: 'Rate the sorted reviews display with URL state on a scale
      of 0 to 1:


      0 - URL state not reflected: Reviews section not visible, or sort dropdown does
      not show "Highest Rated" as selected despite the reviewSort=highest URL parameter,
      or no visual indication of the current sort state.


      1 - URL state correctly applied: Reviews section is visible on the restaurant
      detail page with the sort dropdown trigger clearly showing "Highest Rated" as
      the selected option (matching the reviewSort=highest URL parameter). Review
      cards should be displayed in the reviews area, indicating the sort has been
      applied.'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 3000));
    - |
      document.querySelector('[data-testid="review-sort-dropdown-trigger"]').scrollIntoView({ behavior: 'smooth', block: 'center'});
    - await new Promise(resolve => setTimeout(resolve, 1000));
    - |
      document.querySelector('[data-testid="review-sort-dropdown-trigger"]').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    - await new Promise(resolve => setTimeout(resolve, 500));
