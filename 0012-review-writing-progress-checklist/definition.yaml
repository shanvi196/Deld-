- name: vlm
  args:
    score_name: screenshot_9_rate_the_progress
    screenshot_url: http://localhost:3000/write-review/25047088-5a40-4fab-be5c-3ee9a54fb980
    evaluation_rubric: 'Rate the progress bar at 50% completion on a scale of 0 to
      1:


      0 - Progress bar not visible or incorrect state: Progress bar missing, shows
      wrong percentage (not ~50%), no visual fill indicator, checklist panel not displayed,
      or fewer/more than 2 items show completion status.


      1 - Progress bar correctly shows 50% completion: Progress bar visible at top
      of form with approximately 50% fill using primary color, percentage text shows
      around 50%, expanded checklist panel visible below progress bar showing exactly
      2 completed items (rating and review text) with green checkmarks, and exactly
      2 incomplete items (title and visit type) without checkmarks.'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 5000))
    - (function() { const loginBtn = document.querySelector('[data-testid="header-login-button"]');
      if (loginBtn) loginBtn.click(); })()
    - await new Promise(resolve => setTimeout(resolve, 1500))
    - '(function() { const emailInput = document.querySelector(''[data-testid="login-email-input"]'');
