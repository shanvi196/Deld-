problem_id: 0012-review-writing-progress-checklist
app: deld
task:
  prompt: 'Implement a Review Writing Progress Checklist for the Deld restaurant review
    app. Users need visual guidance on review form completion status.


    **Feature Requirements**:


    1. **Progress Bar Header**: Add a horizontal progress bar at the top of the review
    form showing completion percentage (0-100%). The bar should fill based on completed
    checklist items. Use primary color for filled portion. Include percentage text
    label. Add data-testid="review-progress-bar" for the container and data-testid="review-progress-fill"
    for the filled portion.


    2. **Expandable Checklist Panel**: Add collapsible panel below progress bar with
    completion checklist. Items: "Rating selected" (checked when rating > 0), "Review
    text complete" (checked when >= 85 chars), "Title added" (checked when title has
    content), "Visit details filled" (checked when visitType selected). Each item
    shows checkmark icon and green color when complete. Use data-testid="review-checklist-panel"
    for panel, data-testid="checklist-trigger" for expand button, data-testid="checklist-item-rating",
    data-testid="checklist-item-text", data-testid="checklist-item-title", data-testid="checklist-item-visit"
    for each item.


    **Routes**: Write review page at /write-review/[restaurantId]


    **Element Selectors**:
    - Edit review button: `[data-testid="edit-review-button"]`
    - Rating star 5: `[data-testid="rating-star-5"]`
    - Review title input: `[data-testid="review-title-input"]`
    - Rating star 4: `[data-testid="rating-star-4"]`
    - Rating star 3: `[data-testid="rating-star-3"]`
    - Visit type dine in: `#visit-type-dine-in`'
hint: '**Files**: ~4 files (progress bar component, checklist panel component, integration
  in write-review-form, form schema update if needed)


  **Authentication**: Required - users must be logged in to access review form'
problem_metadata:
  task_type: feature-implementation
  description: Implement a Review Writing Progress Checklist for the Deld restaurant
