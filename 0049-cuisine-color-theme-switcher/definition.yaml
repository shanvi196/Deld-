problem_id: 0049-cuisine-color-theme-switcher
app: deld
task:
  prompt: 'Implement a Cuisine Color Theme Switcher for the Deld app. Users want to
    personalize their browsing experience with cuisine-inspired color palettes.


    **Feature Requirements**:


    1. **Theme Selector Dropdown**: Add a dropdown in the header (next to user avatar
    area) that allows users to select from three cuisine-inspired color themes: Italian
    (red/green accents), Japanese (red/black/white), and Mexican (orange/yellow).
    Each option should display its name with a small color swatch preview. Use data-testid="theme-switcher-trigger"
    for the dropdown trigger button and data-testid="theme-option-{cuisine}" for each
    option (e.g., theme-option-italian). The dropdown menu container should have data-testid="theme-switcher-menu".


    2. **Theme Persistence & Application**: When a theme is selected, update CSS custom
    properties (--primary, --accent) to reflect the chosen palette and persist the
    selection to localStorage under key ''cuisine-theme''. On page load, restore the
    saved theme. Default to the existing orange theme if no preference is saved. The
    body element should have data-theme="{selected-theme}" attribute when a theme
    is active.


    **Routes**: No new routes required (header modification only)


    **Element Selectors**:
    - Theme option default: `[data-testid="theme-option-default"]`
    - Theme option mexican: `[data-testid="theme-option-mexican"]`
    - Theme option japanese: `[data-testid="theme-option-japanese"]`'
hint: '**Files**: ~4 files (theme-switcher component, theme context/hook, globals.css
  theme definitions, header integration)


  **Authentication**: Not required - theme preference is anonymous/local

    **Preferred Account**: If login is required, please use the following credentials:
    - Login: sarah.chen@email.com
    - Password: password123


    **localStorage** use following keys in localStorage:

    - `cuisine-theme`'
