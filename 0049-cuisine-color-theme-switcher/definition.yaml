- name: vlm
  args:
    score_name: screenshot_9_rate_the_theme
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the theme switcher dropdown visibility on a scale of
      0 to 1:


      0 - Theme switcher dropdown not visible: The dropdown menu is not displayed,
      or the trigger button is missing, or fewer than 3 theme options are shown, or
      color swatches/indicators are not present next to theme names.


      1 - Theme switcher dropdown correctly displayed: The dropdown menu (data-testid="theme-switcher-menu")
      is visible and properly positioned in the header area. All three cuisine theme
      options are displayed: Italian, Japanese, and Mexican. Each option has a distinguishable
      color swatch or visual indicator showing its theme colors. The menu is styled
      consistently with the application design.'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - (function() { const trigger = document.querySelector('[data-testid="theme-switcher-trigger"]');
      if (trigger) trigger.click(); })()
    - await new Promise(resolve => setTimeout(resolve, 500))
- name: vlm
  args:
    score_name: screenshot_10_rate_the_italian
    screenshot_url: http://localhost:3000
    evaluation_rubric: 'Rate the Italian theme application on a scale of 0 to 1:


      0 - Italian theme not applied: The page appears with default orange theme colors,
      no visible color changes from baseline, header and buttons still show original
      styling, or the body element does not reflect Italian theme styling.


      1 - Italian theme correctly applied: The page displays Italian-inspired color
      palette with red and green accent colors visible in UI elements. The header
      background or accents show the Italian theme red color. Primary buttons or interactive
      elements display the Italian green accent color. The overall color scheme is
      distinctly different from the default orange theme, reflecting Italian flag-inspired
      colors (red/green).'
    scale:
    - 0
    - 1
    prep_script:
    - await new Promise(resolve => setTimeout(resolve, 2000))
    - (function() { const trigger = document.querySelector('[data-testid="theme-switcher-trigger"]');
      if (trigger) trigger.click(); })()
    - await new Promise(resolve => setTimeout(resolve, 500))
    - (function() { const italian = document.querySelector('[data-testid="theme-option-italian"]');
      if (italian) italian.click(); })()
    - await new Promise(resolve => setTimeout(resolve, 1000))
